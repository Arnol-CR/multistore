<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiStore — Precios de venta</title>
    <link rel="icon" href="/assets/Recurso-3.ico" type="image/x-icon">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0c10; font-family:'Segoe UI',sans-serif; color:#e2e8f0; display:flex; height:100vh; overflow:hidden; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:98; }
        .overlay.active { display:block; }

        /* ── Sidebar (lo arma sidebar.js) ── */
        .sidebar { width:230px; min-width:230px; background:#0d1017; border-right:1px solid #1e2530; display:flex; flex-direction:column; z-index:100; }
        .sidebar-logo { padding:20px 18px; border-bottom:1px solid #1e2530; display:flex; align-items:center; gap:10px; }
        .sidebar-logo img { width:38px; height:38px; object-fit:contain; }
        .sidebar-logo-text { font-size:18px; font-weight:800; color:#fff; letter-spacing:-.5px; }
        .sidebar-logo-text span { color:#3b82f6; }
        .sidebar-user { padding:14px 18px; border-bottom:1px solid #1e2530; display:flex; align-items:center; gap:10px; }
        .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
        .user-info-name { font-size:13px; font-weight:600; color:#d1d5db; }
        .user-info-rol  { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1px; }
        .nav { flex:1; padding:12px 0; overflow-y:auto; }
        .nav-label { font-size:10px; color:#374151; letter-spacing:2px; text-transform:uppercase; padding:10px 18px 4px; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 18px; border-left:2px solid transparent; color:#6b7280; font-size:13.5px; text-decoration:none; }
        .nav-item:hover { color:#e2e8f0; background:#13181f; }
        .nav-item.active { color:#fff; background:linear-gradient(90deg,#1a2540,transparent); border-left-color:#3b82f6; }
        .nav-item svg { width:17px; height:17px; flex-shrink:0; opacity:.7; }
        .nav-badge { margin-left:auto; background:#1e3a5f; color:#60a5fa; font-size:10px; padding:2px 7px; border-radius:99px; font-weight:700; }
        .sidebar-bottom { padding:14px 18px; border-top:1px solid #1e2530; }
        .btn-salir { display:flex; align-items:center; gap:8px; color:#ef4444; font-size:13px; cursor:pointer; padding:8px 0; background:none; border:none; width:100%; }

        /* ── Main ── */
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
        .topbar { background:#0d1017; border-bottom:1px solid #1e2530; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
        .btn-menu { background:none; border:none; cursor:pointer; padding:4px; }
        .topbar-title { font-size:16px; font-weight:700; color:#fff; }
        .topbar-sub { font-size:11px; color:#4b5563; margin-top:1px; }
        .content { flex:1; overflow-y:auto; padding:18px 20px 120px; background:#070910; }

        /* ── Controles ── */
        .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
        .inp { background:#13181f; border:1px solid #1e2530; border-radius:8px; padding:10px 13px; color:#e2e8f0; font-size:13px; outline:none; font-family:inherit; }
        .inp:focus { border-color:#3b82f6; background:#0c1525; }
        .inp::placeholder { color:#374151; }
        .chk { display:flex; align-items:center; gap:7px; font-size:12px; color:#9ca3af; cursor:pointer; user-select:none; }
        .chk input { width:15px; height:15px; accent-color:#3b82f6; cursor:pointer; }
        .btn { border:none; border-radius:8px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-family:inherit; }
        .btn-green { background:#065f46; color:#34d399; border:1px solid #14532d; }
        .btn-green:hover { background:#047857; }
        .btn-green:disabled { opacity:.5; cursor:wait; }
        .btn-ghost { background:transparent; color:#9ca3af; border:1px solid #1e2530; }
        .btn-ghost:hover { border-color:#3b82f6; color:#60a5fa; }
        .btn-amber { background:#2d1f0a; color:#fbbf24; border:1px solid #3d2a0a; }
        .btn-amber:hover { background:#3d2a0a; }
        .btn-sm { padding:6px 11px; font-size:11px; border-radius:6px; }

        /* ── Resumen ── */
        .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
        .stat { background:#0d1017; border:1px solid #1e2530; border-radius:10px; padding:13px 15px; }
        .stat-l { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1.2px; font-weight:700; }
        .stat-v { font-size:22px; font-weight:800; margin-top:4px; }

        /* ── Grupos por cliente ── */
        .grupo { background:#0d1017; border:1px solid #1e2530; border-radius:12px; margin-bottom:14px; overflow:hidden; }
        .grupo-head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #111827; background:#0a0e18; flex-wrap:wrap; }
        .grupo-av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#0891b2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; flex-shrink:0; }
        .grupo-av.sin { background:#2d0a0a; color:#f87171; border:1px solid #7f1d1d; }
        .grupo-nom { font-weight:700; color:#e2e8f0; font-size:14px; }
        .grupo-sub { font-size:11px; color:#6b7280; margin-top:1px; }
        .grupo-tot { margin-left:auto; text-align:right; }
        .grupo-tot .v { font-size:17px; font-weight:800; color:#4ade80; }
        .grupo-tot .l { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1px; }

        table { width:100%; border-collapse:collapse; font-size:12px; }
        th { color:#374151; font-size:10px; text-transform:uppercase; letter-spacing:1px; padding:9px 12px; text-align:left; font-weight:700; border-bottom:1px solid #111827; white-space:nowrap; }
        td { padding:8px 12px; border-bottom:1px solid #0b0f17; color:#9ca3af; vertical-align:middle; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#0a0f18; }
        tr.dirty td { background:#151005; }
        .num { text-align:right; white-space:nowrap; }
        .btn-ver { background:#13181f; border:1px solid #1e2530; color:#9ca3af; border-radius:6px; width:24px; height:22px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; margin-right:7px; vertical-align:-5px; padding:0; }
        .btn-ver:hover { color:#f9a8d4; border-color:#5b1d3a; }
        .foto { width:42px; height:42px; border-radius:6px; object-fit:cover; background:#13181f; display:block; cursor:pointer; }
        .art { font-weight:600; color:#d1d5db; font-size:12.5px; }
        .meta { font-size:10.5px; color:#6b7280; margin-top:2px; }
        .meta code { font-family:monospace; color:#4b5563; }
        .sug { color:#60a5fa; cursor:pointer; border-bottom:1px dashed #1e3a5f; font-weight:600; }
        .sug:hover { color:#93c5fd; }
        .precio { width:110px; text-align:right; font-weight:800; font-size:14px; padding:8px 10px; font-family:inherit; }
        .precio.tiene { color:#4ade80; }
        .precio.cambio { border-color:#b45309; color:#fbbf24; background:#1a1205; }
        .estado { width:26px; text-align:center; font-weight:800; }
        .grupo table { table-layout:fixed; }
        .grupo th:nth-child(1) { width:62px; } .grupo th:nth-child(3) { width:190px; } .grupo th:nth-child(4) { width:90px; }
        .grupo th:nth-child(5) { width:100px; } .grupo th:nth-child(6) { width:140px; } .grupo th:nth-child(7) { width:34px; }
        .art, .meta { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        @media (max-width:900px) { .grupo th:nth-child(6) { width:100px; } .grupo th:nth-child(5) { width:70px; } }
        .cli-in { display:flex; align-items:center; gap:6px; margin-top:6px; max-width:420px; }
        .cli-in .lbl { font-size:10.5px; color:#f87171; font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:4px; }
        .cli-in input { flex:1; min-width:0; padding:6px 9px !important; font-size:12px !important; border-color:#7f1d1d !important; }
        .btn-nuevo { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; background:transparent; border:1px solid #14532d; color:#4ade80; border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; }
        .btn-nuevo:hover { background:#052e16; }
        .cli-act { display:flex; align-items:center; gap:8px; margin-top:3px; font-size:10.5px; }
        .lnk { background:none; border:none; color:#6b7280; font-size:10.5px; cursor:pointer; padding:0; font-family:inherit; text-decoration:underline; text-underline-offset:2px; }
        .lnk:hover { color:#f9a8d4; }
        .cli-in.editar input { border-color:#1e3a5f !important; }
        .cli-in.editar .lbl { color:#60a5fa; }
        .btn-quitar { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; background:transparent; border:1px solid #7f1d1d; color:#f87171; border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; }
        .btn-quitar:hover { background:#1f0707; }
        .precio-bloq { display:inline-flex; align-items:center; justify-content:flex-end; gap:6px; width:110px; padding:8px 10px; border:1px dashed #1e2530; border-radius:8px; color:#4ade80; font-weight:800; font-size:14px; cursor:not-allowed; }
        .precio-bloq svg { color:#4b5563; flex-shrink:0; }
        .precio.correccion { border-color:#7c3aed; color:#c4b5fd; background:#140d24; }
        .cant-tag { display:inline-block; margin-left:7px; padding:1px 8px; border-radius:999px; background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.35); color:#fbbf24; font-size:11px; font-weight:800; vertical-align:1px; }
        .sub-num { display:block; font-size:10.5px; color:#6b7280; font-weight:500; margin-top:3px; white-space:nowrap; }
        .cu { display:block; font-size:10.5px; color:#6b7280; margin-top:3px; text-align:right; white-space:nowrap; }
        .antes { display:block; font-size:10px; color:#7c3aed; margin-top:3px; text-align:right; }
        .asig-todos { display:flex; align-items:center; gap:6px; }
        .asig-todos input { width:230px; padding:7px 10px !important; font-size:12px !important; }
        .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:300; align-items:center; justify-content:center; padding:16px; }
        .modal-bg.open { display:flex; }
        .modal { background:#0d1017; border:1px solid #1e2530; border-radius:14px; width:100%; max-width:520px; }
        .modal-h { padding:16px 20px; border-bottom:1px solid #1e2530; display:flex; justify-content:space-between; align-items:center; font-weight:800; }
        .modal-b { padding:18px 20px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .modal-b .full { grid-column:1 / -1; }
        .modal-f { padding:14px 20px; border-top:1px solid #1e2530; display:flex; justify-content:flex-end; gap:8px; }
        .fl { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1px; font-weight:700; display:block; margin-bottom:5px; }
        .x { background:none; border:none; color:#4b5563; font-size:22px; cursor:pointer; }
        .vacio { text-align:center; padding:60px 20px; color:#374151; font-size:14px; }
        .vacio b { display:block; font-size:34px; margin-bottom:8px; }

        /* ── Barra inferior ── */
        .barra { position:fixed; left:50%; bottom:18px; transform:translate(-50%,150%); transition:transform .25s; z-index:90;
                 width:min(900px, calc(100vw - 32px)); background:#0d1017; border:1px solid #3d2a0a; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.7);
                 padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .barra.visible { transform:translate(-50%,0); }
        .barra .info { font-size:13px; color:#9ca3af; flex:1; }
        .barra .info b { color:#fbbf24; }
        .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:400; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.6); display:none; }
        .toast.ok  { background:#052e16; border:1px solid #14532d; color:#4ade80; }
        .toast.err { background:#1f0707; border:1px solid #7f1d1d; color:#f87171; }
        .zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:500; align-items:center; justify-content:center; cursor:zoom-out; }
        .zoom img { max-width:90vw; max-height:90vh; border-radius:10px; }

        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-thumb { background:#1e2530; border-radius:2px; }
        @media (max-width:900px) {
            .stats { grid-template-columns:1fr 1fr; }
            .col-pedido, .col-costo { display:none; }
            .content { padding:12px 10px 120px; }
            td, th { padding:7px 6px; }
            .precio { width:86px; }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="cerrarMenu()"></div>
<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <button class="btn-menu" onclick="abrirMenu()">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6" stroke="#9ca3af" stroke-width="2"/><line x1="3" y1="12" x2="21" y2="12" stroke="#9ca3af" stroke-width="2"/><line x1="3" y1="18" x2="21" y2="18" stroke="#9ca3af" stroke-width="2"/></svg>
        </button>
        <div>
            <div class="topbar-title">Precios de venta</div>
            <div class="topbar-sub" id="sub-precios">Pon el precio de venta (L) a cada artículo · Enter pasa al siguiente</div>
        </div>
    </div>

    <div class="content">
        <div class="stats">
            <div class="stat"><div class="stat-l">Sin precio</div><div class="stat-v" style="color:#f87171" id="st-sin">—</div></div>
            <div class="stat"><div class="stat-l">Con precio</div><div class="stat-v" style="color:#4ade80" id="st-con">—</div></div>
            <div class="stat"><div class="stat-l">Clientes</div><div class="stat-v" style="color:#60a5fa" id="st-cli">—</div></div>
            <div class="stat"><div class="stat-l">Total por cobrar</div><div class="stat-v" style="color:#e2e8f0" id="st-tot">—</div></div>
        </div>

        <div class="toolbar">
            <input class="inp" id="buscar" style="flex:1;min-width:320px" placeholder="Buscar artículo, descripción, talla, cliente o pedido…" oninput="render()">
            <select class="inp" id="f-pedido" onchange="cambiarFiltro()" style="max-width:220px" title="Filtrar por pedido (opcional)"><option value="">Todos los pedidos</option></select>
            <label class="chk"><input type="checkbox" id="f-sin" checked onchange="cambiarFiltro()"> Solo sin precio</label>
            <label class="chk"><input type="checkbox" id="f-agrupar" checked onchange="cambiarFiltro()"> Agrupar por cliente</label>
            <select class="inp" id="f-vend" onchange="cambiarFiltro()" style="max-width:220px;display:none" title="Filtrar por vendedor"><option value="">Todos los vendedores</option></select>
            <label class="chk" id="wrap-mios" style="display:none"><input type="checkbox" id="f-mios" onchange="cambiarFiltro()"> Solo mis artículos</label>
            <button class="btn btn-amber btn-sm" onclick="usarSugeridoTodos()" title="Pone el precio sugerido en todas las casillas vacías visibles"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg> Sugerido en vacíos</button>
            <button class="btn-nuevo" style="padding:8px 12px" onclick="abrirNuevoCliente([])"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Nuevo cliente</button>
            <button class="btn btn-ghost btn-sm" onclick="cargar()" title="Actualizar"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
        </div>

        <div id="lista"><div class="vacio">Cargando…</div></div>
    </div>
</main>

<div class="barra" id="barra">
    <div class="info" id="barra-info"></div>
    <button class="btn btn-ghost" onclick="descartar()">Descartar</button>
    <button class="btn btn-green" id="btn-guardar" onclick="guardar()"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M20 6 9 17l-5-5"/></svg> Guardar</button>
</div>
<datalist id="dl-cli"></datalist>
<div class="modal-bg" id="m-cli">
    <div class="modal">
        <div class="modal-h"><span style="display:flex;align-items:center;gap:8px"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Nuevo cliente</span><button class="x" onclick="cerrarNuevoCliente()">×</button></div>
        <div class="modal-b">
            <div><label class="fl">Nombre *</label><input class="inp" id="nc-nombre" style="width:100%"></div>
            <div><label class="fl">Apellido *</label><input class="inp" id="nc-apellido" style="width:100%"></div>
            <div><label class="fl">Teléfono</label><input class="inp" id="nc-tel" maxlength="8" placeholder="8 dígitos" style="width:100%"></div>
            <div><label class="fl">Correo</label><input class="inp" id="nc-correo" type="email" style="width:100%"></div>
            <div class="full"><label class="fl">Dirección</label><input class="inp" id="nc-dir" style="width:100%"></div>
            <div class="full" id="nc-vend-wrap"><label class="fl">Vendedor *</label><select class="inp" id="nc-vend" style="width:100%"></select></div>
            <div class="full" id="nc-para" style="font-size:11.5px;color:#6b7280"></div>
        </div>
        <div class="modal-f">
            <button class="btn btn-ghost" onclick="cerrarNuevoCliente()">Cancelar</button>
            <button class="btn btn-green" id="nc-btn" onclick="crearCliente()"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Crear cliente</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zoom-img"></div>

<script>
    const usuario = JSON.parse(localStorage.getItem('ms_usuario') || 'null');
    if (!usuario) window.location.href = '/login.html';
    if (usuario && usuario.esAdmin) document.getElementById('wrap-mios').style.display = 'flex';
    if (usuario && !usuario.esAdmin) document.getElementById('sub-precios').textContent += ' · Un precio ya guardado solo lo cambia el administrador';

    let datos = [];             // artículos del servidor
    let clientes = [], vendedores = [];
    const cambios = new Map();  // IdDetallePedido -> precio escrito (número o '')
    const estados = new Map();  // IdDetallePedido -> 'ok' | 'err:mensaje'

    const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const norm = t => (t || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const L = v => 'L ' + Number(v || 0).toLocaleString('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const red5 = v => (!v || v <= 0) ? 0 : Math.round(v / 5) * 5;
    const fecha = f => f ? String(f).substring(0,10).split('-').reverse().join('/') : '';

    function toast(tipo, txt) {
        const t = document.getElementById('toast');
        t.className = 'toast ' + tipo; t.textContent = txt; t.style.display = 'block';
        clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
    }

    async function cargarClientes() {
        try {
            const d = await fetch('/api/clientes/todos').then(r => r.json());
            clientes = d.ok ? d.data : [];
            // Un vendedor solo ve y asigna sus propios clientes
            if (!usuario.esAdmin) clientes = clientes.filter(c => c.IdVendedor === usuario.id);
        } catch (e) { clientes = []; }
        document.getElementById('dl-cli').innerHTML = clientes.map(c => `<option value="${esc(etiqCli(c))}">`).join('');
    }
    const etiqCli = c => (c.NombreCompleto || '').trim() + (c.CodigoCliente ? ' (' + c.CodigoCliente + ')' : '');
    function clientePorTexto(t) {
        const n = norm(t).trim(); if (!n) return null;
        return clientes.find(c => norm(etiqCli(c)) === n) || clientes.find(c => norm(c.NombreCompleto).trim() === n) || clientes.find(c => c.CodigoCliente && norm(c.CodigoCliente) === n) || null;
    }

    async function cargar() {
        if (!clientes.length) cargarClientes();
        try {
            const [d, c] = await Promise.all([
                fetch(`/api/pedidos/recientes?idVendedor=${usuario.id}&esAdmin=${usuario.esAdmin ? 1 : 0}`).then(r => r.json()),
                fetch('/api/pedidos/costos').then(r => r.json()).catch(() => ({}))
            ]);
            datos = d.ok ? d.data : [];
            if (c && c.ok) { const m = new Map(c.data.map(x => [x.IdDetallePedido, x])); datos.forEach(p => { const x = m.get(p.IdDetallePedido); if (x) { p.ValorCompra = x.ValorCompra; p.CantidadArticulos = x.CantidadArticulos; p.Link = x.Link; p.TasaCambio = x.TasaCambio; } }); }
        } catch (e) { datos = []; toast('err', 'No se pudieron cargar los artículos'); }
        opcionesFiltros();
        const qp = new URLSearchParams(location.search).get('pedido');
        if (qp && !window._pedidoQP) { window._pedidoQP = true; if ([...document.getElementById('f-pedido').options].some(o => o.value === qp)) { document.getElementById('f-pedido').value = qp; document.getElementById('f-sin').checked = false; } }
        render();
    }

    // Recalcula las opciones de pedido y vendedor (con su conteo de "sin precio")
    function opcionesFiltros() {
        const sel = document.getElementById('f-pedido'), actual = sel.value;
        const peds = [...new Set(datos.map(p => p.NoPedidoAplicacion || p.NumeroPedido).filter(Boolean))];
        sel.innerHTML = '<option value="">Todos los pedidos</option>' + peds.map(x => {
            const n = datos.filter(p => (p.NoPedidoAplicacion || p.NumeroPedido) === x && !p.ValorCobroCliente).length;
            const t = (datos.find(p => (p.NoPedidoAplicacion || p.NumeroPedido) === x) || {}).NombreEmpresa;
            return `<option value="${esc(x)}">${esc(x)}${t ? ' · ' + esc(t) : ''}${n ? ' · ' + n + ' sin precio' : ''}</option>`;
        }).join('');
        sel.value = peds.includes(actual) ? actual : '';
        if (usuario.esAdmin) {
            const sv = document.getElementById('f-vend'), act = sv.value;
            const vs = [...new Map(datos.filter(p => p.IdVendedor).map(p => [p.IdVendedor, p.NombreVendedor || ('Vendedor ' + p.IdVendedor)])).entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1])));
            const sinV = datos.filter(p => !p.IdVendedor).length;
            sv.innerHTML = '<option value="">Todos los vendedores</option>' + vs.map(([id, n]) => {
                const k = datos.filter(p => p.IdVendedor === id && !p.ValorCobroCliente).length;
                return `<option value="${id}">${esc(n)}${k ? ' · ' + k + ' sin precio' : ''}</option>`;
            }).join('') + (sinV ? `<option value="sin">Sin vendedor · ${sinV}</option>` : '');
            sv.value = [...sv.options].some(o => o.value === act) ? act : '';
            sv.style.display = '';
        }
    }

    // Al cambiar un filtro, los recién guardados dejan de quedarse fijos en la lista
    function cambiarFiltro() {
        for (const [id, st] of estados) if (st === 'ok') estados.delete(id);
        render();
    }

    // Un precio ya guardado solo lo cambia el administrador
    const editCli = new Set(), editGrupo = new Set();
    function bloqueado(p) { return !usuario.esAdmin && parseFloat(p.ValorCobroCliente) > 0; }
    function editarCli(ids) { ids.forEach(i => editCli.add(i)); render(); setTimeout(() => { const el = document.querySelector('.cli-in.editar input'); if (el) el.focus(); }, 30); }
    function cancelarCli(ids) { ids.forEach(i => editCli.delete(i)); render(); }
    async function quitarCliente(ids) {
        ids = ids.filter(id => { const p = datos.find(x => x.IdDetallePedido === id); return p && p.IdCliente; });
        if (!ids.length) return;
        if (!confirm(ids.length === 1 ? '¿Dejar este artículo sin cliente?' : `¿Dejar estos ${ids.length} artículos sin cliente?`)) return;
        try {
            const d = await fetch('/api/clientes/quitar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ids, idUsuario: usuario.id }) }).then(r => r.json());
            if (!d.ok) { toast('err', 'Error: ' + d.error); return; }
            datos.forEach(p => { if (ids.includes(p.IdDetallePedido)) { p.IdCliente = null; p.NombreCliente = null; } });
            ids.forEach(i => editCli.delete(i)); editGrupo.clear();
            render();
            toast('ok', ids.length === 1 ? 'El artículo quedó sin cliente' : `${ids.length} artículos quedaron sin cliente`);
        } catch (e) { toast('err', 'Error de conexión'); }
    }

    function precioActual(p) {
        return cambios.has(p.IdDetallePedido) ? cambios.get(p.IdDetallePedido) : (p.ValorCobroCliente || '');
    }

    function baseIndicadores() {
        const mios = document.getElementById('f-mios').checked;
        const fVend = document.getElementById('f-vend').value;
        const ped = document.getElementById('f-pedido').value;
        return datos.filter(p => {
            if (ped && (p.NoPedidoAplicacion || p.NumeroPedido) !== ped) return false;
            if (mios && p.IdVendedor !== usuario.id) return false;
            if (fVend === 'sin' ? p.IdVendedor : (fVend && String(p.IdVendedor) !== fVend)) return false;
            return true;
        });
    }

    function filtrados() {
        const q = norm(document.getElementById('buscar').value.trim());
        const sin = document.getElementById('f-sin').checked;
        const mios = document.getElementById('f-mios').checked;
        const fVend = document.getElementById('f-vend').value;
        const ped = document.getElementById('f-pedido').value;
        return datos.filter(p => {
            if (ped && (p.NoPedidoAplicacion || p.NumeroPedido) !== ped) return false;
            // "solo sin precio": se quedan visibles los que estás editando o acabas de guardar
            if (sin && p.ValorCobroCliente && !cambios.has(p.IdDetallePedido) && !estados.has(p.IdDetallePedido)) return false;
            if (mios && p.IdVendedor !== usuario.id) return false;
            if (fVend === 'sin' ? p.IdVendedor : (fVend && String(p.IdVendedor) !== fVend)) return false;
            if (!q) return true;
            // cada palabra puede estar en cualquier campo: "vestido rojo" encuentra Vestido · Rojo / 2-3Y
            const texto = norm([p.NombreArticulo, p.DescripcionArticulo, p.NombreCliente, p.NoPedidoAplicacion, p.NumeroPedido, p.TallaColor, p.CodigoArticulo, p.NombreEmpresa, p.NombreVendedor].join(' '));
            return q.split(/\s+/).every(w => texto.includes(w));
        });
    }

    function verArt(id) { const a = datos.find(x => x.IdDetallePedido === id); if (a) verArticuloModal(a); }

    const cantDe = p => Math.max(1, parseInt(p.CantidadArticulos) || 1);
    const Lc = v => 'L ' + (Math.abs(v - Math.round(v)) < 0.005 ? Math.round(v).toLocaleString('es-HN') : v.toLocaleString('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    function textoCU(p, v) { const c = cantDe(p), n = parseFloat(v); return c > 1 && n > 0 ? `${c} × ${Lc(n / c)} c/u` : ''; }

    function fila(p) {
        const id = p.IdDetallePedido;
        const cant = cantDe(p);
        const val = precioActual(p);
        const sug = red5(p.PrecioSugerido);
        const cambiado = cambios.has(id);
        const st = estados.get(id) || '';
        const icono = st === 'ok' ? '<span style="color:#4ade80" title="Guardado"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M20 6 9 17l-5-5"/></svg></span>'
                    : st.startsWith('err') ? `<span style="color:#f87171" title="${esc(st.substring(4))}"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>`
                    : cambiado ? '<span style="color:#fbbf24" title="Sin guardar"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg></span>' : '';
        const costo = p.ValorCompra != null ? (cant > 1 ? `$${(Number(p.ValorCompra) * cant).toFixed(2)}<span class="sub-num">$${Number(p.ValorCompra).toFixed(2)} c/u</span>` : `$${Number(p.ValorCompra).toFixed(2)}`) : '—';
        return `<tr class="${cambiado ? 'dirty' : ''}">
            <td style="width:54px">${p.Fotografia ? `<img class="foto" src="${esc(p.Fotografia)}" loading="lazy" onclick="verArt(${id})" title="Ver artículo" onerror="this.style.visibility='hidden'">` : `<div class="foto" onclick="verArt(${id})" title="Ver artículo"></div>`}</td>
            <td>
                <div class="art"><button class="btn-ver" type="button" onclick="verArt(${id})" title="Ver artículo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></button>${esc(p.NombreArticulo || '—')}${cant > 1 ? `<span class="cant-tag" title="Cantidad pedida">×${cant}</span>` : ''}${p.TallaColor ? ` <span style="color:#6b7280;font-weight:400">· ${esc(p.TallaColor)}</span>` : ''}</div>
                <div class="meta">${p.DescripcionArticulo ? esc(String(p.DescripcionArticulo).substring(0, 70)) + ' · ' : ''}<code>${esc(p.CodigoArticulo || '')}</code></div>
                ${p.IdCliente && !editCli.has(id) ? `<div class="cli-act">${document.getElementById('f-agrupar').checked ? '' : `<span style="color:#93c5fd">${esc(p.NombreCliente || '')}</span>`}<button class="lnk" type="button" onclick="editarCli([${id}])">Cambiar cliente</button></div>` : p.IdCliente ? `
                <div class="cli-in editar">
                    <span class="lbl"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Cambiar a</span>
                    <input class="inp" list="dl-cli" placeholder="Buscar cliente…" autocomplete="off" onchange="asignarDesdeTexto([${id}], this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();} if(event.key==='Escape'){cancelarCli([${id}]);}">
                    <button class="btn-quitar" type="button" onclick="quitarCliente([${id}])" title="Dejar el artículo sin cliente">Quitar</button>
                    <button class="lnk" type="button" onclick="cancelarCli([${id}])">Cancelar</button>
                </div>` : `
                <div class="cli-in">
                    <span class="lbl"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Sin cliente</span>
                    <input class="inp" list="dl-cli" placeholder="Buscar cliente…" autocomplete="off" onchange="asignarDesdeTexto([${id}], this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">
                    <button class="btn-nuevo" type="button" onclick="abrirNuevoCliente([${id}])"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Nuevo</button>
                </div>`}
            </td>
            <td class="col-pedido" style="font-size:11px;white-space:nowrap">${esc(p.NoPedidoAplicacion || p.NumeroPedido || '')}<div class="meta">${fecha(p.FechaPedido)} · ${esc(p.NombreEmpresa || '')}</div></td>
            <td class="num col-costo">${costo}</td>
            <td class="num">${sug ? `<span class="sug" title="Usar sugerido${cant > 1 ? ' (total de la línea)' : ''}" onclick="ponerSugerido(${id}, ${sug})">L ${sug}</span>${cant > 1 ? `<span class="sub-num">${Lc(sug / cant)} c/u</span>` : ''}` : '<span style="color:#374151">—</span>'}</td>
            <td class="num">${bloqueado(p) ? `<span class="precio-bloq" title="Ya tiene precio. Solo el administrador puede cambiarlo."><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>${esc(p.ValorCobroCliente)}</span>${cant > 1 ? `<span class="cu">${textoCU(p, p.ValorCobroCliente)}</span>` : ''}`
                : `<input class="inp precio ${cambiado ? (parseFloat(p.ValorCobroCliente) > 0 ? 'correccion' : 'cambio') : (val ? 'tiene' : '')}" type="number" min="0" step="5" inputmode="decimal"
                   data-id="${id}" value="${val}" placeholder="0" oninput="escribir(${id}, this.value)" onkeydown="teclaPrecio(event, this)" onfocus="this.select()"
                   title="${parseFloat(p.ValorCobroCliente) > 0 ? 'Precio guardado: L ' + esc(p.ValorCobroCliente) + '. Como administrador podés corregirlo.' : ''}${cant > 1 ? (parseFloat(p.ValorCobroCliente) > 0 ? ' ' : '') + 'Escribí el total de las ' + cant + ' unidades.' : ''}">${cant > 1 ? `<span class="cu" data-cu="${id}">${textoCU(p, val) || 'Total de ' + cant + ' unidades'}</span>` : ''}${cambiado && parseFloat(p.ValorCobroCliente) > 0 ? `<span class="antes">antes L ${esc(p.ValorCobroCliente)}</span>` : ''}`}</td>
            <td class="estado">${icono}</td>
        </tr>`;
    }

    function cabeceraTabla() {
        return `<thead><tr><th></th><th>Artículo</th><th class="col-pedido">Pedido</th><th class="num col-costo">Costo</th><th class="num">Sugerido</th><th class="num">Precio (L)</th><th></th></tr></thead>`;
    }

    function render() {
        const foco = document.activeElement && document.activeElement.classList.contains('precio') ? document.activeElement.dataset.id : null;
        const lista = filtrados();
        const agrupar = document.getElementById('f-agrupar').checked;
        const cont = document.getElementById('lista');

        // Resumen: sigue al vendedor, al pedido y a "Solo mis artículos" (no a la búsqueda ni a "Solo sin precio")
        const base = baseIndicadores();
        const sinP = base.filter(p => !p.ValorCobroCliente).length;
        document.getElementById('st-sin').textContent = sinP;
        document.getElementById('st-con').textContent = base.length - sinP;
        document.getElementById('st-cli').textContent = new Set(base.filter(p => p.IdCliente).map(p => p.IdCliente)).size;
        document.getElementById('st-tot').textContent = L(base.reduce((a, p) => a + (parseFloat(precioActual(p)) || 0), 0));

        if (!lista.length) {
            cont.innerHTML = `<div class="vacio"><b></b>${datos.length ? 'No hay artículos con estos filtros' : 'No hay artículos pendientes'}</div>`;
        } else if (!agrupar) {
            cont.innerHTML = `<div class="grupo"><table>${cabeceraTabla()}<tbody>${lista.map(fila).join('')}</tbody></table></div>`;
        } else {
            const grupos = new Map();
            lista.forEach(p => {
                const k = p.IdCliente || 0;
                if (!grupos.has(k)) grupos.set(k, []);
                grupos.get(k).push(p);
            });
            const orden = [...grupos.keys()].sort((a, b) => (a === 0) - (b === 0) || norm(grupos.get(a)[0].NombreCliente).localeCompare(norm(grupos.get(b)[0].NombreCliente)));
            cont.innerHTML = orden.map(k => {
                const items = grupos.get(k);
                const nom = k ? (items[0].NombreCliente || 'Cliente') : 'Sin cliente asignado';
                const ini = k ? nom.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() : '?';
                const total = items.reduce((a, p) => a + (parseFloat(precioActual(p)) || 0), 0);
                const faltan = items.filter(p => !(parseFloat(precioActual(p)) > 0)).length;
                return `<div class="grupo">
                    <div class="grupo-head">
                        <div class="grupo-av ${k ? '' : 'sin'}">${esc(ini)}</div>
                        <div>
                            <div class="grupo-nom">${esc(nom)}</div>
                            <div class="grupo-sub">${items.length} artículo${items.length === 1 ? '' : 's'}${faltan ? ` · <span style="color:#f87171">${faltan} sin precio</span>` : ' · <span style="color:#4ade80">todos con precio</span>'}${items[0].NombreVendedor && k ? ' · ' + esc(items[0].NombreVendedor) : ''}</div>
                        </div>
                        ${k ? (editGrupo.has(k) ? `<div class="asig-todos"><input class="inp" list="dl-cli" placeholder="Pasar los ${items.length} a otro cliente…" autocomplete="off"
                              onchange="asignarDesdeTexto(filtrados().filter(p => p.IdCliente === ${k}).map(p => p.IdDetallePedido), this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();} if(event.key==='Escape'){editGrupo.delete(${k});render();}">
                              <button class="btn-quitar" type="button" onclick="quitarCliente(filtrados().filter(p => p.IdCliente === ${k}).map(p => p.IdDetallePedido))">Quitar cliente</button>
                              <button class="lnk" type="button" onclick="editGrupo.delete(${k});render()">Cancelar</button></div>`
                            : `<button class="lnk" type="button" onclick="editGrupo.add(${k});render()" title="Pasar estos artículos a otro cliente">Cambiar cliente</button>`) : `<div class="asig-todos"><input class="inp" list="dl-cli" placeholder="Asignar todos a un cliente…" autocomplete="off"
                              onchange="asignarDesdeTexto(filtrados().filter(p => !p.IdCliente).map(p => p.IdDetallePedido), this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"></div>`}
                        ${faltan ? `<button class="btn btn-amber btn-sm" onclick="usarSugeridoGrupo(${k})"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg> Sugerido en vacíos</button>` : ''}
                        <div class="grupo-tot"><div class="l">Total</div><div class="v">${L(total)}</div></div>
                    </div>
                    <table>${cabeceraTabla()}<tbody>${items.map(fila).join('')}</tbody></table>
                </div>`;
            }).join('');
        }
        actualizarBarra();
        if (foco) { const el = document.querySelector(`.precio[data-id="${foco}"]`); if (el) el.focus({ preventScroll: true }); }
    }

    /* ── Clientes: asignar y crear ── */
    async function asignarCliente(ids, c) {
        if (!c) return false;
        ids = ids.filter(id => { const p = datos.find(x => x.IdDetallePedido === id); return p && p.IdCliente !== c.IdCliente; });   // evita repetir
        if (!ids.length) return false;
        try {
            const d = ids.length === 1
                ? await fetch('/api/clientes/asignar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ idCliente: c.IdCliente, idDetallePedido: ids[0], idUsuario: usuario.id }) }).then(r => r.json())
                : await fetch('/api/clientes/asignar-multiple', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ idCliente: c.IdCliente, idDetalles: ids.join(','), idUsuario: usuario.id }) }).then(r => r.json());
            if (!d.ok) { toast('err', 'Error: ' + d.error); return false; }
            const cambio = datos.some(p => ids.includes(p.IdDetallePedido) && p.IdCliente);
            datos.forEach(p => { if (ids.includes(p.IdDetallePedido)) { p.IdCliente = c.IdCliente; p.NombreCliente = c.NombreCompleto; } });
            ids.forEach(i => editCli.delete(i)); editGrupo.clear();
            render();
            toast('ok', `${cambio ? 'Cliente cambiado a' : 'Cliente'} ${c.NombreCompleto}${cambio ? '' : ' asignado'} en ${ids.length} artículo${ids.length === 1 ? '' : 's'}`);
            return true;
        } catch (e) { toast('err', 'Error de conexión'); return false; }
    }
    function asignarDesdeTexto(ids, input) {
        const t = input.value.trim(); if (!t) return;
        const c = clientePorTexto(t);
        if (!c) { abrirNuevoCliente(ids, t); return; }
        asignarCliente(ids, c);
    }
    let ncIds = [];
    async function abrirNuevoCliente(ids, texto) {
        ncIds = ids || [];
        const partes = (texto || '').replace(/\s*\([^)]*\)$/, '').trim().split(/\s+/);
        document.getElementById('nc-nombre').value = partes.length > 1 ? partes.slice(0, Math.ceil(partes.length / 2)).join(' ') : (partes[0] || '');
        document.getElementById('nc-apellido').value = partes.length > 1 ? partes.slice(Math.ceil(partes.length / 2)).join(' ') : '';
        ['nc-tel', 'nc-correo', 'nc-dir'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('nc-para').textContent = ncIds.length ? `Se asignará a ${ncIds.length} artículo${ncIds.length === 1 ? '' : 's'} al crearlo.` : '';
        const sel = document.getElementById('nc-vend');
        if (usuario.esAdmin) {
            if (!vendedores.length) { try { const d = await fetch('/api/vendedores').then(r => r.json()); vendedores = d.ok ? d.data : []; } catch (e) {} }
            sel.innerHTML = vendedores.map(v => `<option value="${v.IdVendedor}">${esc(`${v.Nombres} ${v.Apellidos || ''}`.trim())} (${esc(v.CodigoVendedor || '')})</option>`).join('');
            sel.value = usuario.id;
            document.getElementById('nc-vend-wrap').style.display = '';
        } else {
            sel.innerHTML = `<option value="${usuario.id}">Yo</option>`;
            document.getElementById('nc-vend-wrap').style.display = 'none';
        }
        document.getElementById('m-cli').classList.add('open');
        setTimeout(() => document.getElementById(document.getElementById('nc-nombre').value ? 'nc-tel' : 'nc-nombre').focus(), 50);
    }
    function cerrarNuevoCliente() { document.getElementById('m-cli').classList.remove('open'); }
    async function crearCliente() {
        const g = id => document.getElementById(id).value.trim();
        const nombre = g('nc-nombre'), apellido = g('nc-apellido'), tel = g('nc-tel'), idV = parseInt(document.getElementById('nc-vend').value);
        if (!nombre || !apellido) { toast('err', 'Nombre y apellido son obligatorios'); return; }
        if (tel && !/^\d{8}$/.test(tel)) { toast('err', 'El teléfono debe tener 8 dígitos'); return; }
        const b = document.getElementById('nc-btn'); b.disabled = true;
        try {
            const d = await fetch('/api/clientes/nuevo', { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ nombre, apellido, telefono: tel, correo: g('nc-correo'), direccion: g('nc-dir'), idVendedor: idV }) }).then(r => r.json());
            if (!d.ok) { toast('err', 'Error: ' + d.error); return; }
            await cargarClientes();
            const completo = norm(nombre + ' ' + apellido).trim();
            const nuevo = clientes.filter(c => norm(c.NombreCompleto).trim() === completo).sort((a, b) => b.IdCliente - a.IdCliente)[0];
            cerrarNuevoCliente();
            if (nuevo && ncIds.length) await asignarCliente(ncIds, nuevo);
            else toast('ok', `Cliente ${nombre} ${apellido} creado`);
        } catch (e) { toast('err', 'Error de conexión'); }
        finally { b.disabled = false; }
    }

    function escribir(id, v) {
        const orig = datos.find(p => p.IdDetallePedido === id);
        const n = v === '' ? '' : parseFloat(v);
        estados.delete(id);
        if ((n || '') == (orig.ValorCobroCliente || '')) cambios.delete(id); else cambios.set(id, n);
        // actualizar solo esta fila visualmente (sin re-render para no perder el foco)
        const inp = document.querySelector(`.precio[data-id="${id}"]`);
        const tr = inp.closest('tr');
        tr.classList.toggle('dirty', cambios.has(id));
        const cu = tr.querySelector(`[data-cu="${id}"]`); if (cu) cu.textContent = textoCU(orig, v) || 'Total de ' + cantDe(orig) + ' unidades';
        inp.classList.toggle('cambio', cambios.has(id));
        tr.querySelector('.estado').innerHTML = cambios.has(id) ? '<span style="color:#fbbf24" title="Sin guardar"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg></span>' : '';
        actualizarBarra(true);
    }

    function teclaPrecio(e, el) {
        if (e.key === 'Enter' || (e.key === 'ArrowDown')) {
            e.preventDefault();
            const todos = [...document.querySelectorAll('.precio')];
            const sig = todos[todos.indexOf(el) + 1];
            if (sig) { sig.focus(); sig.scrollIntoView({ block:'center', behavior:'smooth' }); }
            else if (e.key === 'Enter' && cambios.size) guardar();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const todos = [...document.querySelectorAll('.precio')];
            const ant = todos[todos.indexOf(el) - 1]; if (ant) ant.focus();
        }
    }

    function ponerSugerido(id, sug) {
        const inp = document.querySelector(`.precio[data-id="${id}"]`);
        inp.value = sug; escribir(id, String(sug)); inp.focus();
    }
    function sugeridoEn(items) {
        let n = 0;
        items.forEach(p => {
            const sug = red5(p.PrecioSugerido);
            if (sug && !(parseFloat(precioActual(p)) > 0)) { cambios.set(p.IdDetallePedido, sug); estados.delete(p.IdDetallePedido); n++; }
        });
        render();
        toast(n ? 'ok' : 'err', n ? `Sugerido puesto en ${n} artículo${n === 1 ? '' : 's'}. Revisa y guarda.` : 'No hay vacíos con precio sugerido');
    }
    function usarSugeridoTodos() { sugeridoEn(filtrados()); }
    function usarSugeridoGrupo(k) { sugeridoEn(filtrados().filter(p => (p.IdCliente || 0) === k)); }

    function actualizarBarra(sinRender) {
        const n = [...cambios.values()].filter(v => v !== '').length;
        const borrados = [...cambios.values()].filter(v => v === '').length;
        const tot = [...cambios.values()].reduce((a, v) => a + (parseFloat(v) || 0), 0);
        document.getElementById('barra').classList.toggle('visible', cambios.size > 0);
        document.getElementById('barra-info').innerHTML = `<b>${cambios.size}</b> precio${cambios.size === 1 ? '' : 's'} sin guardar · ${L(tot)}` + (borrados ? ` · <span style="color:#6b7280">${borrados} vacío(s) no se guardan</span>` : '');
        document.getElementById('btn-guardar').textContent = `Guardar ${n}`;
        if (sinRender) {
            // refrescar totales sin redibujar la tabla
            document.getElementById('st-tot').textContent = L(baseIndicadores().reduce((a, p) => a + (parseFloat(precioActual(p)) || 0), 0));
        }
    }

    function descartar() { cambios.clear(); estados.clear(); render(); }

    async function guardar() {
        const ids = [...cambios.entries()].filter(([, v]) => v !== '' && v > 0).map(([id]) => id);
        if (!ids.length) { toast('err', 'No hay precios para guardar'); return; }
        const btn = document.getElementById('btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        let ok = 0, err = 0, primerError = '';
        for (let i = 0; i < ids.length; i += 8) {
            await Promise.all(ids.slice(i, i + 8).map(async id => {
                try {
                    const d = await fetch('/api/clientes/precio', { method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ idDetallePedido: id, valorCobro: cambios.get(id), idUsuario: usuario.id }) }).then(r => r.json());
                    if (d.ok) {
                        ok++; estados.set(id, 'ok');
                        const p = datos.find(x => x.IdDetallePedido === id); if (p) p.ValorCobroCliente = cambios.get(id);
                        cambios.delete(id);
                    } else {
                        err++; estados.set(id, 'err:' + d.error); primerError = primerError || d.error;
                        if (d.bloqueado) { const p = datos.find(x => x.IdDetallePedido === id); if (p) p.ValorCobroCliente = d.anterior; cambios.delete(id); }
                    }
                } catch (e) { err++; estados.set(id, 'err:Error de conexión'); primerError = primerError || 'Error de conexión'; }
            }));
        }
        btn.disabled = false;
        opcionesFiltros();
        render();
        // se ve la marca de guardado un momento y luego la lista se pone al día con los filtros
        clearTimeout(window._tLimpiar);
        window._tLimpiar = setTimeout(() => { cambiarFiltro(); }, 1500);
        toast(err ? 'err' : 'ok', err ? `${ok} guardados · ${err} con error: ${primerError}` : `${ok} precio${ok === 1 ? '' : 's'} guardado${ok === 1 ? '' : 's'}`);
    }

    function verFoto(src) { document.getElementById('zoom-img').src = src; document.getElementById('zoom').style.display = 'flex'; }

    window.addEventListener('beforeunload', e => { if (cambios.size) { e.preventDefault(); e.returnValue = ''; } });

    window.addEventListener('articulo-actualizado', () => render());
    cargar();
</script>
<script src="/assets/ver-articulo.js"></script>
<script src="/assets/sidebar.js"></script>
</body>
