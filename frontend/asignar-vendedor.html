<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiStore — Asignar vendedores</title>
    <link rel="icon" href="/assets/Recurso-3.ico" type="image/x-icon">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0c10; font-family:'Segoe UI',sans-serif; color:#e2e8f0; display:flex; height:100vh; overflow:hidden; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:98; }
        .overlay.active { display:block; }

        /* ── Sidebar (lo arma sidebar.js) ── */
        .sidebar { width:230px; min-width:230px; background:#0d1017; border-right:1px solid #1e2530; display:flex; flex-direction:column; z-index:100; }
        .sidebar-logo { padding:20px 18px; border-bottom:1px solid #1e2530; display:flex; align-items:center; gap:10px; }
        .sidebar-logo img { width:38px; height:38px; object-fit:contain; }
        .sidebar-logo-text { font-size:18px; font-weight:800; color:#fff; letter-spacing:-.5px; }
        .sidebar-logo-text span { color:#3b82f6; }
        .sidebar-user { padding:14px 18px; border-bottom:1px solid #1e2530; display:flex; align-items:center; gap:10px; }
        .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
        .user-info-name { font-size:13px; font-weight:600; color:#d1d5db; }
        .user-info-rol  { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1px; }
        .nav { flex:1; padding:12px 0; overflow-y:auto; }
        .nav-label { font-size:10px; color:#374151; letter-spacing:2px; text-transform:uppercase; padding:10px 18px 4px; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 18px; border-left:2px solid transparent; color:#6b7280; font-size:13.5px; text-decoration:none; }
        .nav-item:hover { color:#e2e8f0; background:#13181f; }
        .nav-item.active { color:#fff; background:linear-gradient(90deg,#1a2540,transparent); border-left-color:#3b82f6; }
        .nav-item svg { width:17px; height:17px; flex-shrink:0; opacity:.7; }
        .nav-badge { margin-left:auto; background:#1e3a5f; color:#60a5fa; font-size:10px; padding:2px 7px; border-radius:99px; font-weight:700; }
        .sidebar-bottom { padding:14px 18px; border-top:1px solid #1e2530; }
        .btn-salir { display:flex; align-items:center; gap:8px; color:#ef4444; font-size:13px; cursor:pointer; padding:8px 0; background:none; border:none; width:100%; }

        /* ── Main ── */
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
        .topbar { background:#0d1017; border-bottom:1px solid #1e2530; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
        .btn-menu { background:none; border:none; cursor:pointer; padding:4px; }
        .topbar-title { font-size:16px; font-weight:700; color:#fff; }
        .topbar-sub { font-size:11px; color:#4b5563; margin-top:1px; }
        .content { flex:1; overflow-y:auto; padding:18px 20px 120px; background:#070910; }

        /* ── Controles ── */
        .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
        .inp { background:#13181f; border:1px solid #1e2530; border-radius:8px; padding:10px 13px; color:#e2e8f0; font-size:13px; outline:none; font-family:inherit; }
        .inp:focus { border-color:#3b82f6; background:#0c1525; }
        .inp::placeholder { color:#374151; }
        .chk { display:flex; align-items:center; gap:7px; font-size:12px; color:#9ca3af; cursor:pointer; user-select:none; }
        .chk input { width:15px; height:15px; accent-color:#3b82f6; cursor:pointer; }
        .btn { border:none; border-radius:8px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-family:inherit; }
        .btn-green { background:#065f46; color:#34d399; border:1px solid #14532d; }
        .btn-green:hover { background:#047857; }
        .btn-green:disabled { opacity:.5; cursor:wait; }
        .btn-ghost { background:transparent; color:#9ca3af; border:1px solid #1e2530; }
        .btn-ghost:hover { border-color:#3b82f6; color:#60a5fa; }
        .btn-amber { background:#2d1f0a; color:#fbbf24; border:1px solid #3d2a0a; }
        .btn-amber:hover { background:#3d2a0a; }
        .btn-sm { padding:6px 11px; font-size:11px; border-radius:6px; }

        /* ── Resumen ── */
        .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
        .stat { background:#0d1017; border:1px solid #1e2530; border-radius:10px; padding:13px 15px; }
        .stat-l { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1.2px; font-weight:700; }
        .stat-v { font-size:22px; font-weight:800; margin-top:4px; }

        /* ── Grupos por cliente ── */
        .grupo { background:#0d1017; border:1px solid #1e2530; border-radius:12px; margin-bottom:14px; overflow:hidden; }
        .grupo-head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #111827; background:#0a0e18; flex-wrap:wrap; }
        .grupo-av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#0891b2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; flex-shrink:0; }
        .grupo-av.sin { background:#2d0a0a; color:#f87171; border:1px solid #7f1d1d; }
        .grupo-nom { font-weight:700; color:#e2e8f0; font-size:14px; }
        .grupo-sub { font-size:11px; color:#6b7280; margin-top:1px; }
        .grupo-tot { margin-left:auto; text-align:right; }
        .grupo-tot .v { font-size:17px; font-weight:800; color:#4ade80; }
        .grupo-tot .l { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1px; }

        table { width:100%; border-collapse:collapse; font-size:12px; }
        th { color:#374151; font-size:10px; text-transform:uppercase; letter-spacing:1px; padding:9px 12px; text-align:left; font-weight:700; border-bottom:1px solid #111827; white-space:nowrap; }
        td { padding:8px 12px; border-bottom:1px solid #0b0f17; color:#9ca3af; vertical-align:middle; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#0a0f18; }
        tr.dirty td { background:#151005; }
        .num { text-align:right; white-space:nowrap; }
        .foto { width:42px; height:42px; border-radius:6px; object-fit:cover; background:#13181f; display:block; cursor:zoom-in; }
        .art { font-weight:600; color:#d1d5db; font-size:12.5px; }
        .meta { font-size:10.5px; color:#6b7280; margin-top:2px; }
        .meta code { font-family:monospace; color:#4b5563; }
        .sug { color:#60a5fa; cursor:pointer; border-bottom:1px dashed #1e3a5f; font-weight:600; }
        .sug:hover { color:#93c5fd; }
        .precio { width:110px; text-align:right; font-weight:800; font-size:14px; padding:8px 10px; font-family:inherit; }
        .precio.tiene { color:#4ade80; }
        .precio.cambio { border-color:#b45309; color:#fbbf24; background:#1a1205; }
        .estado { width:26px; text-align:center; font-weight:800; }
        .vacio { text-align:center; padding:60px 20px; color:#374151; font-size:14px; }
        .vacio b { display:block; font-size:34px; margin-bottom:8px; }

        /* ── Barra inferior ── */
        .barra { position:fixed; left:50%; bottom:18px; transform:translate(-50%,150%); transition:transform .25s; z-index:90;
                 width:min(900px, calc(100vw - 32px)); background:#0d1017; border:1px solid #3d2a0a; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.7);
                 padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .barra.visible { transform:translate(-50%,0); }
        .barra .info { font-size:13px; color:#9ca3af; flex:1; }
        .barra .info b { color:#fbbf24; }
        .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:400; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.6); display:none; }
        .toast.ok  { background:#052e16; border:1px solid #14532d; color:#4ade80; }
        .toast.err { background:#1f0707; border:1px solid #7f1d1d; color:#f87171; }
        .zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:500; align-items:center; justify-content:center; cursor:zoom-out; }
        .zoom img { max-width:90vw; max-height:90vh; border-radius:10px; }

        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-thumb { background:#1e2530; border-radius:2px; }
        @media (max-width:900px) {
            .stats { grid-template-columns:1fr 1fr; }
            .col-pedido, .col-costo { display:none; }
            .content { padding:12px 10px 120px; }
            td, th { padding:7px 6px; }
            .precio { width:86px; }
        }
    </style>
    <style>
        .layout { display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start; }
        .vend-panel { background:#0d1017; border:1px solid #1e2530; border-radius:12px; overflow:hidden; position:sticky; top:0; }
        .vend-head { padding:12px 14px; border-bottom:1px solid #111827; font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1.5px; font-weight:700; }
        .vend { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; border-left:3px solid transparent; border-bottom:1px solid #0b0f17; }
        .vend:hover { background:#13181f; }
        .vend.sel { background:#1f1025; border-left-color:#c084fc; }
        .vend-av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#3b1f5e,#7c3aed); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; flex-shrink:0; }
        .vend-av.quitar { background:#2d0a0a; color:#f87171; border:1px solid #7f1d1d; }
        .vend-nom { font-size:13px; font-weight:600; color:#d1d5db; }
        .vend-cod { font-size:11px; color:#6b7280; }
        .vend-n { margin-left:auto; font-size:11px; font-weight:700; color:#c084fc; background:#1f1025; border:1px solid #3b1f5e; border-radius:99px; padding:2px 8px; }
        .items { background:#0d1017; border:1px solid #1e2530; border-radius:12px; overflow:hidden; }
        .btn-ver { background:#13181f; border:1px solid #1e2530; color:#9ca3af; border-radius:6px; width:24px; height:22px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; margin-right:7px; vertical-align:-5px; padding:0; }
        .btn-ver:hover { color:#f9a8d4; border-color:#5b1d3a; }
        .foto-g { width:68px !important; height:68px !important; border-radius:8px !important; }
        .chk-row { width:17px; height:17px; accent-color:#c084fc; cursor:pointer; }
        tr.sel td { background:#160d1f !important; }
        .pill { font-size:10.5px; padding:2px 8px; border-radius:99px; font-weight:700; white-space:nowrap; }
        .pill.sin { background:#2d0a0a; color:#f87171; }
        .pill.con { background:#1f1025; color:#c084fc; }
        .barra { border-color:#3b1f5e !important; }
        .barra .info b { color:#c084fc !important; }
        .btn-purple { background:#3b1080; color:#e9d5ff; border:1px solid #581c87; }
        .btn-purple:hover { background:#4c1d95; }
        .btn-purple:disabled { opacity:.5; cursor:not-allowed; }
        @media (max-width:900px) { .layout { grid-template-columns:1fr; } .vend-panel { position:relative; } .vend-lista { display:flex; overflow-x:auto; } .vend { min-width:200px; border-bottom:none; } }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="cerrarMenu()"></div>
<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <button class="btn-menu" onclick="abrirMenu()">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6" stroke="#9ca3af" stroke-width="2"/><line x1="3" y1="12" x2="21" y2="12" stroke="#9ca3af" stroke-width="2"/><line x1="3" y1="18" x2="21" y2="18" stroke="#9ca3af" stroke-width="2"/></svg>
        </button>
        <div>
            <div class="topbar-title">Asignar vendedores</div>
            <div class="topbar-sub">1. Elige el vendedor · 2. Marca los artículos · 3. Asignar</div>
        </div>
    </div>

    <div class="content">
        <div class="layout">
            <div class="vend-panel">
                <div class="vend-head">Vendedores</div>
                <div class="vend-lista" id="vendedores">
                    <div class="vacio" style="padding:20px">Cargando…</div>
                </div>

                <!-- Botón Generar tarjetas -->
                <div style="padding:12px 14px; border-top:1px solid #1e2530;">
                    <button class="btn btn-ghost" id="btn-tarjetas" onclick="generarTarjetas()" 
                            style="width:100%; justify-content:center;" 
                            title="Genera una imagen con el listado numerado de los artículos marcados">
                        Copiar listado
                    </button>
                </div>
            </div>

            <div>
                <div class="toolbar">
                    <input class="inp" id="buscar" style="flex:1;min-width:320px" placeholder="Buscar artículo, descripción, talla, cliente o pedido…" oninput="render()">
                    <select class="inp" id="f-estado" onchange="render()">
                        <option value="sin">Sin vendedor</option>
                        <option value="todos">Todos</option>
                        <option value="con">Con vendedor</option>
                    </select>
                    <select class="inp" id="f-pedido" onchange="render()" style="min-width:320px;max-width:100%"><option value="">Todos los pedidos</option></select>
                    <button class="btn btn-ghost btn-sm" onclick="cargar()" title="Actualizar"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
                </div>
                <div class="items">
                    <table>
                        <thead><tr>
                            <th style="width:36px"><input type="checkbox" class="chk-row" id="chk-todos" title="Marcar todos los visibles" onchange="marcarTodos(this.checked)"></th>
                            <th class="num" style="width:40px">N°</th><th style="width:84px"></th><th>Artículo</th><th>Talla / color</th><th class="num">Cant.</th><th class="num">Precio app</th><th class="col-pedido">Pedido</th><th>Vendedor</th>
                        </tr></thead>
                        <tbody id="tbody"><tr><td colspan="9" class="vacio">Cargando…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="barra" id="barra">
    <div class="info" id="barra-info"></div>
    <button class="btn btn-ghost" onclick="limpiar()">Quitar selección</button>
    <button class="btn btn-purple" id="btn-asignar" onclick="asignar()">Asignar</button>
</div>
<div class="toast" id="toast"></div>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zoom-img"></div>

<script>
    const usuario = JSON.parse(localStorage.getItem('ms_usuario') || 'null');
    if (!usuario) window.location.href = '/login.html';
    else if (!usuario.esAdmin) window.location.href = '/dashboard.html';

    let datos = [], vendedores = [];
    let vendSel;                 // undefined = ninguno, null = quitar vendedor, número = IdVendedor
    const marcados = new Set();

    const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const norm = t => (t || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const fecha = f => f ? String(f).substring(0,10).split('-').reverse().join('/') : '';
    const nomVen = v => `${v.Nombres} ${v.Apellidos || ''}`.trim();

    function toast(tipo, txt) {
        const t = document.getElementById('toast');
        t.className = 'toast ' + tipo; t.textContent = txt; t.style.display = 'block';
        clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
    }

    async function cargar() {
        try {
            const [p, v, c] = await Promise.all([
                fetch(`/api/pedidos/recientes?idVendedor=${usuario.id}&esAdmin=1`).then(r => r.json()),
                fetch('/api/vendedores').then(r => r.json()),
                fetch('/api/pedidos/costos').then(r => r.json()).catch(() => ({}))
            ]);
            datos = p.ok ? p.data : []; vendedores = v.ok ? v.data : [];
            // precio de la app (precio de compra) y cantidad de cada artículo
            if (c && c.ok) { const m = new Map(c.data.map(x => [x.IdDetallePedido, x])); datos.forEach(d => { const x = m.get(d.IdDetallePedido); if (x) { d.ValorCompra = x.ValorCompra; d.CantidadArticulos = x.CantidadArticulos; d.Link = x.Link; d.TasaCambio = x.TasaCambio; } }); }
        } catch (e) { toast('err', 'No se pudieron cargar los datos'); }
        // pedidos para el filtro
        const sel = document.getElementById('f-pedido'), actual = sel.value;
        const peds = [...new Set(datos.map(p => p.NoPedidoAplicacion || p.NumeroPedido).filter(Boolean))];
        sel.innerHTML = '<option value="">Todos los pedidos</option>' + peds.map(x => {
            const n = datos.filter(p => (p.NoPedidoAplicacion || p.NumeroPedido) === x && !p.IdVendedor).length;
            const t = (datos.find(p => (p.NoPedidoAplicacion || p.NumeroPedido) === x) || {}).NombreEmpresa;
            return `<option value="${esc(x)}">${esc(x)}${t ? ' · ' + esc(t) : ''}${n ? ' · ' + n + ' sin vendedor' : ''}</option>`;
        }).join('');
        sel.value = peds.includes(actual) ? actual : '';
        const existentes = new Set(datos.map(p => p.IdDetallePedido));
        [...marcados].forEach(id => { if (!existentes.has(id)) marcados.delete(id); });
        renderVendedores(); render();
    }

    function renderVendedores() {
        const cuenta = id => datos.filter(p => p.IdVendedor === id).length;
        const sinV = datos.filter(p => !p.IdVendedor).length;
        document.getElementById('vendedores').innerHTML = vendedores.map(v => `
            <div class="vend ${vendSel === v.IdVendedor ? 'sel' : ''}" onclick="elegirVendedor(${v.IdVendedor})">
                <div class="vend-av">${esc((v.Nombres || '?')[0] + (v.Apellidos ? v.Apellidos[0] : ''))}</div>
                <div style="min-width:0"><div class="vend-nom">${esc(nomVen(v))}${v.IdVendedor === usuario.id ? ' <span style="font-size:10px;color:#4b5563">(yo)</span>' : ''}</div><div class="vend-cod">${esc(v.CodigoVendedor || '')}</div></div>
                <span class="vend-n" title="Artículos pendientes asignados">${cuenta(v.IdVendedor)}</span>
            </div>`).join('') + `
            <div class="vend ${vendSel === null ? 'sel' : ''}" onclick="elegirVendedor(null)">
                <div class="vend-av quitar"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.14em;flex-shrink:0"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
                <div><div class="vend-nom" style="color:#f87171">Quitar vendedor</div><div class="vend-cod">Dejar sin vendedor</div></div>
                <span class="vend-n" style="color:#f87171;background:#2d0a0a;border-color:#7f1d1d" title="Artículos sin vendedor">${sinV}</span>
            </div>`;
    }

    function elegirVendedor(id) { vendSel = id; renderVendedores(); actualizarBarra(); }

    function filtrados() {
        const q = norm(document.getElementById('buscar').value.trim());
        const est = document.getElementById('f-estado').value;
        const ped = document.getElementById('f-pedido').value;
        return datos.filter(p => {
            if (est === 'sin' && p.IdVendedor && !marcados.has(p.IdDetallePedido)) return false;
            if (est === 'con' && !p.IdVendedor) return false;
            if (ped && (p.NoPedidoAplicacion || p.NumeroPedido) !== ped) return false;
            if (!q) return true;
            // cada palabra puede estar en cualquier campo: "vestido rojo" encuentra Vestido · Rojo / 2-3Y
            const texto = norm([p.NombreArticulo, p.DescripcionArticulo, p.NombreCliente, p.NoPedidoAplicacion, p.NumeroPedido, p.TallaColor, p.CodigoArticulo, p.NombreEmpresa, p.NombreVendedor].join(' '));
            return q.split(/\s+/).every(w => texto.includes(w));
        });
    }

    function verArt(id) { const a = datos.find(x => x.IdDetallePedido === id); if (a) verArticuloModal(a); }

    function render() {
        const lista = filtrados();
        const tb = document.getElementById('tbody');
        tb.innerHTML = lista.length ? lista.map((p, i) => {
            const m = marcados.has(p.IdDetallePedido);
            return `<tr class="${m ? 'sel' : ''}" onclick="if(event.target.tagName!=='INPUT' && event.target.tagName!=='IMG') toggle(${p.IdDetallePedido})" style="cursor:pointer">
                <td><input type="checkbox" class="chk-row" ${m ? 'checked' : ''} onchange="toggle(${p.IdDetallePedido})"></td>
                <td class="num" style="color:#6b7280;font-weight:700;font-size:12px">${i + 1}</td>
                <td onclick="event.stopPropagation()">${p.Fotografia ? `<img class="foto foto-g" src="${esc(p.Fotografia)}" loading="lazy" onclick="verArt(${p.IdDetallePedido})" title="Ver artículo" style="cursor:pointer" onerror="this.style.visibility='hidden'">` : `<div class="foto foto-g" onclick="verArt(${p.IdDetallePedido})" title="Ver artículo" style="cursor:pointer"></div>`}</td>
                <td><div class="art"><button class="btn-ver" type="button" onclick="event.stopPropagation();verArt(${p.IdDetallePedido})" title="Ver artículo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></button>${esc(p.NombreArticulo || '—')}</div>
                    <div class="meta">${p.DescripcionArticulo ? esc(String(p.DescripcionArticulo).substring(0, 80)) : ''}</div></td>
                <td style="font-size:12.5px;color:#d1d5db">${p.TallaColor ? esc(p.TallaColor) : '<span style="color:#374151">—</span>'}</td>
                <td class="num" style="font-weight:700;font-size:14px;color:${(p.CantidadArticulos || 1) > 1 ? '#fbbf24' : '#9ca3af'}">${p.CantidadArticulos || 1}</td>
                <td class="num" style="font-weight:700;color:#e2e8f0;white-space:nowrap">${p.ValorCompra != null ? '$' + Number(p.ValorCompra).toFixed(2) + ((p.CantidadArticulos || 1) > 1 ? `<div style="color:#6b7280;font-weight:400;font-size:11px">total $${(p.ValorCompra * p.CantidadArticulos).toFixed(2)}</div>` : '') : '<span style="color:#374151">—</span>'}</td>
                <td class="col-pedido" style="font-size:11px;white-space:nowrap">${esc(p.NoPedidoAplicacion || p.NumeroPedido || '')}<div class="meta">${fecha(p.FechaPedido)} · ${esc(p.NombreEmpresa || '')}</div></td>
                <td>${p.IdVendedor ? `<span class="pill con">${esc(p.CodigoVendedor || p.NombreVendedor || 'Asignado')}</span>` : '<span class="pill sin">Sin vendedor</span>'}</td>
            </tr>`;
        }).join('') : `<tr><td colspan="9" class="vacio"><b></b>${datos.length ? 'No hay artículos con estos filtros' : 'No hay artículos pendientes'}</td></tr>`;
        const chk = document.getElementById('chk-todos');
        const n = lista.filter(p => marcados.has(p.IdDetallePedido)).length;
        chk.checked = lista.length > 0 && n === lista.length; chk.indeterminate = n > 0 && n < lista.length;
        actualizarBarra();
    }

    function toggle(id) { marcados.has(id) ? marcados.delete(id) : marcados.add(id); render(); }
    function marcarTodos(on) { filtrados().forEach(p => on ? marcados.add(p.IdDetallePedido) : marcados.delete(p.IdDetallePedido)); render(); }
    function limpiar() { marcados.clear(); render(); }

    function actualizarBarra() {
        const n = marcados.size;
        document.getElementById('barra').classList.toggle('visible', n > 0);
        const v = vendedores.find(x => x.IdVendedor === vendSel);
        const destino = vendSel === null ? 'quitar vendedor' : v ? nomVen(v) : null;
        document.getElementById('barra-info').innerHTML = `<b>${n}</b> artículo${n === 1 ? '' : 's'} marcado${n === 1 ? '' : 's'}` +
            (destino ? ` → <b>${esc(destino)}</b>` : ' · <span style="color:#fbbf24">elige un vendedor a la izquierda</span>');
        const btn = document.getElementById('btn-asignar');
        btn.disabled = vendSel === undefined;
        btn.textContent = vendSel === null ? `Quitar vendedor a ${n}` : `Asignar ${n}`;
    }

    async function asignar() {
        const ids = [...marcados];
        if (!ids.length || vendSel === undefined) return;
        const btn = document.getElementById('btn-asignar'); btn.disabled = true; btn.textContent = 'Guardando…';
        let ok = 0, primerError = '';
        for (let i = 0; i < ids.length; i += 8) {
            const res = await Promise.all(ids.slice(i, i + 8).map(id => fetch('/api/vendedores/asignar', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ idDetalle: id, idVendedor: vendSel }) }).then(r => r.json()).catch(() => ({ ok:false, error:'Error de conexión' }))));
            res.forEach(r => { if (r.ok) ok++; else primerError = primerError || r.error; });
        }
        const v = vendedores.find(x => x.IdVendedor === vendSel);
        if (ok === ids.length) toast('ok', vendSel === null ? `Vendedor quitado a ${ok} artículo(s)` : `${ok} artículo(s) asignados a ${nomVen(v)}`);
        else toast('err', `${ok} de ${ids.length} · error: ${primerError}`);
        marcados.clear();
        await cargar();
    }

    // ========== GENERAR TARJETAS ==========
    async function generarTarjetas() {
        const ids = [...marcados];
        
        if (!ids.length) {
            toast('err', 'Marca al menos un artículo primero');
            return;
        }

        if (typeof window.generarTarjetasMultiples !== 'function') {
            toast('err', 'No se cargó la función de tarjetas. Recarga la página con Ctrl+F5');
            return;
        }

        // en el mismo orden (y numeración) que se ve en la tabla
        const visibles = filtrados().filter(p => marcados.has(p.IdDetallePedido));
        const articulos = visibles.concat(ids.map(id => datos.find(x => x.IdDetallePedido === id)).filter(p => p && !visibles.includes(p)));

        if (!articulos.length) {
            toast('err', 'No se encontraron los artículos seleccionados');
            return;
        }

        const btn = document.getElementById('btn-tarjetas');
        const txtOriginal = btn ? btn.innerHTML : 'Copiar listado';
        
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = 'Generando…';
        }

        try {
            
            const canvas = await window.generarTarjetasMultiples(articulos);
            
            // Copiar la imagen; si el navegador no deja, se descarga
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                toast('ok', `Listado copiado (${articulos.length} artículo${articulos.length === 1 ? '' : 's'}). Pegalo en WhatsApp con Ctrl + V`);
            } catch (err) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `listado-articulos-${articulos.length}.png`;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                toast('err', 'El navegador no dejó copiar la imagen; se descargó el archivo');
            }
        } catch (e) {
            console.error('Error generando tarjetas:', e);
            toast('err', 'Error: ' + (e.message || e));
        }

        if (btn) {
            btn.disabled = false;
            btn.innerHTML = txtOriginal;
        }
    }

    function verFoto(src) { document.getElementById('zoom-img').src = src; document.getElementById('zoom').style.display = 'flex'; }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && marcados.size) limpiar(); });

    window.addEventListener('articulo-actualizado', () => { if (typeof renderVendedores === 'function') renderVendedores(); render(); });
    cargar();
</script>
<script src="/assets/ver-articulo.js"></script>
<script src="/assets/sidebar.js"></script>
</body>
