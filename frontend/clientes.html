<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiStore — Clientes y saldos</title>
    <link rel="icon" href="/assets/Recurso-3.ico" type="image/x-icon">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --fondo:#070910; --panel:#0d1017; --panel2:#13181f; --borde:#1e2530; --borde2:#2a3342;
            --texto:#e2e8f0; --suave:#9ca3af; --tenue:#6b7280; --mudo:#4b5563;
            --rosa:#E8327A; --naranja:#EF7A30; --verde:#4ade80; --rojo:#f87171; --ambar:#fbbf24; --azul:#60a5fa; --morado:#c084fc;
        }
        body { background:#0a0c10; font-family:'Segoe UI',sans-serif; color:var(--texto); display:flex; height:100vh; overflow:hidden; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:98; }
        .overlay.active { display:block; }

        /* ── Sidebar (lo arma sidebar.js) ── */
        .sidebar { width:230px; min-width:230px; background:#0d1017; border-right:1px solid #1e2530; display:flex; flex-direction:column; z-index:100; }
        .sidebar-logo { padding:20px 18px; border-bottom:1px solid #1e2530; display:flex; align-items:center; gap:10px; }
        .sidebar-logo img { width:38px; height:38px; object-fit:contain; }
        .sidebar-logo-text { font-size:18px; font-weight:800; color:#fff; letter-spacing:-.5px; }
        .sidebar-logo-text span { color:#3b82f6; }
        .sidebar-user { padding:14px 18px; border-bottom:1px solid #1e2530; display:flex; align-items:center; gap:10px; }
        .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
        .user-info-name { font-size:13px; font-weight:600; color:#d1d5db; }
        .user-info-rol  { font-size:10px; color:#4b5563; text-transform:uppercase; letter-spacing:1px; }
        .nav { flex:1; padding:12px 0; overflow-y:auto; }
        .nav-label { font-size:10px; color:#374151; letter-spacing:2px; text-transform:uppercase; padding:10px 18px 4px; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 18px; border-left:2px solid transparent; color:#6b7280; font-size:13.5px; text-decoration:none; }
        .nav-item:hover { color:#e2e8f0; background:#13181f; }
        .nav-item.active { color:#fff; background:linear-gradient(90deg,#1a2540,transparent); border-left-color:#3b82f6; }
        .nav-item svg { width:17px; height:17px; flex-shrink:0; opacity:.7; }
        .nav-badge { margin-left:auto; background:#1e3a5f; color:#60a5fa; font-size:10px; padding:2px 7px; border-radius:99px; font-weight:700; }
        .sidebar-bottom { padding:14px 18px; border-top:1px solid #1e2530; }
        .btn-salir { display:flex; align-items:center; gap:8px; color:#ef4444; font-size:13px; cursor:pointer; padding:8px 0; background:none; border:none; width:100%; }

        /* ── Main ── */
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
        .topbar { background:var(--panel); border-bottom:1px solid var(--borde); padding:12px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
        .btn-menu { background:none; border:none; cursor:pointer; padding:4px; }
        .topbar-title { font-size:16px; font-weight:700; color:#fff; }
        .topbar-sub { font-size:11px; color:var(--mudo); margin-top:1px; }
        .seg { margin-left:auto; display:flex; gap:3px; background:var(--panel2); border:1px solid var(--borde); border-radius:9px; padding:3px; }
        .seg button { background:none; border:none; color:var(--tenue); font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:7px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:7px; white-space:nowrap; }
        .seg button.on { background:var(--panel); color:#fff; box-shadow:0 1px 0 var(--borde2); }
        .seg button:hover:not(.on) { color:var(--texto); }
        .content { flex:1; overflow-y:auto; padding:20px 22px 60px; background:var(--fondo); }
        .vista { display:none; }
        .vista.on { display:block; }
        .ico { width:16px; height:16px; flex-shrink:0; }

        /* KPIs */
        .kpis { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
        .kpi { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden; min-width:0; cursor:pointer; transition:.15s; text-align:left; font-family:inherit; color:inherit; }
        .kpi:hover { border-color:var(--borde2); }
        .kpi.on { border-color:var(--acento); box-shadow:inset 0 0 0 1px var(--acento); }
        .kpi::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--acento, var(--borde2)); }
        .kpi-tit { font-size:10.5px; color:var(--tenue); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
        .kpi-val { font-size:23px; font-weight:800; color:#fff; margin-top:7px; letter-spacing:-.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
        .kpi-val .mon { font-size:13px; color:var(--tenue); font-weight:600; margin-right:3px; }
        .kpi-pie { font-size:11.5px; color:var(--tenue); margin-top:4px; display:flex; justify-content:space-between; gap:6px; }
        .mio { display:inline-flex; align-items:center; gap:5px; color:var(--suave); white-space:nowrap; }
        .mio::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--rosa); }

        /* Barra de herramientas */
        .barra { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
        .inp { background:var(--panel2); border:1px solid var(--borde); border-radius:8px; padding:9px 12px; color:var(--texto); font-size:13px; outline:none; font-family:inherit; }
        .inp:focus { border-color:#3b82f6; background:#0c1525; }
        .inp::placeholder { color:#374151; }
        select.inp { cursor:pointer; }
        .buscar { flex:1; min-width:220px; }
        .chk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--suave); cursor:pointer; user-select:none; white-space:nowrap; }
        .chk input { accent-color:#3b82f6; width:15px; height:15px; }
        .btn { border:1px solid var(--borde); background:var(--panel2); color:var(--suave); border-radius:8px; padding:9px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-decoration:none; }
        .btn:hover { color:#fff; border-color:var(--borde2); }
        .btn.rosa { background:var(--rosa); border-color:var(--rosa); color:#fff; }
        .btn.rosa:hover { background:#d12a6d; }
        .btn.verde { background:#052e16; border-color:#14532d; color:var(--verde); }
        .btn.verde:hover { background:#064e24; }
        .btn:disabled { opacity:.55; cursor:wait; }
        .btn-sm { padding:6px 10px; font-size:12px; border-radius:7px; }

        /* Tabla de saldos */
        .card { background:var(--panel); border:1px solid var(--borde); border-radius:12px; min-width:0; }
        .tabla-wrap { overflow-x:auto; }
        table.t { width:100%; border-collapse:collapse; font-size:13px; }
        .t th { text-align:left; font-size:10px; color:var(--mudo); text-transform:uppercase; letter-spacing:1px; font-weight:600; padding:12px 12px 10px; border-bottom:1px solid var(--borde); white-space:nowrap; background:var(--panel); position:sticky; top:0; z-index:1; }
        .t td { padding:10px 12px; border-bottom:1px solid #111722; vertical-align:middle; }
        .t tbody tr.cli:hover td { background:#0f141c; }
        .t tbody tr.cli { cursor:pointer; }
        .t tr.mia td:first-child { box-shadow:inset 3px 0 0 var(--rosa); }
        .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
        .grupo td { background:#0a0e15; padding:9px 12px; cursor:pointer; user-select:none; }
        .grupo .gnom { display:flex; align-items:center; gap:9px; font-weight:700; color:#fff; font-size:13px; }
        .grupo .gnom small { color:var(--tenue); font-weight:500; font-size:11.5px; }
        .grupo .flecha { color:var(--mudo); transition:transform .15s; display:flex; }
        .grupo.cerrado .flecha { transform:rotate(-90deg); }
        .c-nom { display:flex; align-items:center; gap:10px; min-width:0; }
        .c-av { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; color:#fff; flex-shrink:0; }
        .c-txt { min-width:0; }
        .c-txt b { display:block; color:#f1f5f9; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
        .c-txt small { font-size:11px; color:var(--tenue); }
        .barrita { width:90px; height:5px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:5px; margin-left:auto; }
        .barrita div { height:100%; border-radius:99px; }
        .saldo { font-weight:800; font-size:14px; }
        .estado { font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
        .e-cobrar { background:rgba(248,113,113,.1); color:var(--rojo); }
        .e-parcial { background:rgba(251,191,36,.1); color:var(--ambar); }
        .e-camino { background:rgba(96,165,250,.1); color:var(--azul); }
        .e-dia { background:rgba(74,222,128,.08); color:var(--verde); }
        .e-favor { background:rgba(192,132,252,.1); color:var(--morado); }
        .acc { display:flex; gap:6px; justify-content:flex-end; }
        .btn-ico { background:var(--panel2); border:1px solid var(--borde); color:var(--suave); border-radius:7px; width:32px; height:30px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; }
        .btn-ico:hover { color:#fff; border-color:var(--borde2); }
        .btn-ico.wa:hover { color:#25d366; border-color:#14532d; }
        .total-fila td { background:#0a0e15; font-weight:800; color:#fff; border-bottom:none; }
        .vacio { text-align:center; color:var(--tenue); padding:40px 10px; font-size:13px; }

        /* Estado de cuenta */
        .ec-buscar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
        .ec-cab { display:flex; align-items:center; gap:14px; padding:18px 20px; flex-wrap:wrap; }
        .ec-av { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#fff; flex-shrink:0; }
        .ec-nom { font-size:19px; font-weight:800; color:#fff; letter-spacing:-.2px; }
        .ec-meta { font-size:12px; color:var(--tenue); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap; }
        .ec-meta span { display:inline-flex; align-items:center; gap:5px; }
        .ec-acc { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
        .ec-kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin:14px 0; }
        .ec-kpis .kpi { cursor:default; }
        .ec-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:14px; }
        .card-cab { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 0; flex-wrap:wrap; }
        .card-tit { font-size:13px; font-weight:700; color:#fff; }
        .card-sub { font-size:11px; color:var(--mudo); margin-top:2px; }
        .mov-tipo { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; }
        .mt-compra { background:rgba(232,50,122,.1); color:#f9a8d4; }
        .mt-pago { background:rgba(74,222,128,.1); color:var(--verde); }
        .mt-otro { background:rgba(251,191,36,.1); color:var(--ambar); }
        .ref { font-family:monospace; font-size:11.5px; color:var(--suave); }
        tr.mov.compra { cursor:pointer; }
        tr.mov.compra:hover td { background:#0f141c; }
        tr.detalle td { background:#0a0e15; padding:6px 12px 10px 40px; }
        .mini-art { display:flex; align-items:center; gap:9px; padding:5px 0; font-size:12px; border-bottom:1px dashed #161c26; }
        .mini-art:last-child { border-bottom:none; }
        .mini-art img, .mini-art .ph { width:34px; height:34px; border-radius:6px; object-fit:contain; background:#fff; flex-shrink:0; cursor:pointer; }
        .mini-art .ph { background:var(--panel2); }
        .mini-art .n { flex:1; min-width:0; }
        .mini-art .n b { display:block; color:#e2e8f0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mini-art .n small { color:var(--tenue); font-size:11px; }
        .lista-art { padding:8px 16px 14px; }
        .opc { display:flex; gap:14px; flex-wrap:wrap; padding:10px 20px 14px; border-top:1px solid var(--borde); font-size:12px; color:var(--tenue); align-items:center; }
        .opc b { color:var(--suave); font-weight:600; }
        .ver-mas { display:block; width:calc(100% - 32px); margin:8px 16px 14px; background:none; border:1px dashed var(--borde2); color:var(--suave); border-radius:8px; padding:8px; font-size:12px; cursor:pointer; font-family:inherit; }
        .ver-mas:hover { color:#fff; }
        .dd { position:relative; flex:1; min-width:260px; }
        .dd-lista { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--panel); border:1px solid var(--borde2); border-radius:10px; max-height:340px; overflow-y:auto; z-index:20; display:none; box-shadow:0 14px 40px rgba(0,0,0,.6); }
        .dd-lista.on { display:block; }
        .dd-item { display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; border-bottom:1px solid #111722; }
        .dd-item:hover, .dd-item.sel { background:#131a25; }
        .dd-item .s { margin-left:auto; font-weight:700; font-size:12.5px; font-variant-numeric:tabular-nums; }

        /* Nuevo cliente */
        .form { max-width:620px; padding:20px; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form label { font-size:10.5px; color:var(--tenue); text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:5px; font-weight:600; }
        .form .inp { width:100%; }
        .full { grid-column:1 / -1; }
        .msg { margin-top:12px; font-size:13px; padding:10px 14px; border-radius:8px; display:none; }
        .msg.ok { display:block; background:#052e16; border:1px solid #14532d; color:var(--verde); }
        .msg.err { display:block; background:#1f0707; border:1px solid #7f1d1d; color:#fca5a5; }

        .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; z-index:1300; box-shadow:0 8px 30px rgba(0,0,0,.6); display:none; }
        .toast.ok { display:block; background:#052e16; border:1px solid #14532d; color:var(--verde); }
        .toast.err { display:block; background:#1f0707; border:1px solid #7f1d1d; color:#fca5a5; }
        .cargando { color:var(--tenue); padding:30px; text-align:center; font-size:13px; }

        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-thumb { background:#1e2530; border-radius:3px; }

        @media (max-width:1250px) { .kpis { grid-template-columns:repeat(3, minmax(0,1fr)); } }
        @media (max-width:1000px) { .ec-grid { grid-template-columns:1fr; } .ec-kpis { grid-template-columns:1fr 1fr; } }
        @media (max-width:768px) {
            .sidebar { position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); }
            .content { padding:14px 16px 40px; }
            .kpis { grid-template-columns:1fr 1fr; gap:10px; }
            .kpi-val { font-size:19px; }
            .seg { margin-left:0; width:100%; }
            .seg button { flex:1; justify-content:center; padding:7px 6px; font-size:12px; }
            .col-movil-no { display:none; }
            .c-txt b { max-width:140px; }
            .form-grid { grid-template-columns:1fr; }
            .ec-acc { margin-left:0; width:100%; }
            .ec-acc .btn { flex:1; justify-content:center; }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="cerrarMenu()"></div>
<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <button class="btn-menu" onclick="abrirMenu()" aria-label="Menú">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6" stroke="#9ca3af" stroke-width="2"/><line x1="3" y1="12" x2="21" y2="12" stroke="#9ca3af" stroke-width="2"/><line x1="3" y1="18" x2="21" y2="18" stroke="#9ca3af" stroke-width="2"/></svg>
        </button>
        <div>
            <div class="topbar-title">Clientes y saldos</div>
            <div class="topbar-sub">Quién debe, cuánto se puede cobrar ya y el estado de cuenta de cada cliente</div>
        </div>
        <div class="seg" id="seg">
            <button class="on" data-v="saldos" onclick="verVista('saldos')"></button>
            <button data-v="estado" onclick="verVista('estado')"></button>
            <button data-v="nuevo" onclick="verVista('nuevo')"></button>
        </div>
    </div>

    <div class="content">

        <!-- ═════════ SALDOS ═════════ -->
        <section class="vista on" id="v-saldos">
            <div class="kpis" id="kpis"></div>

            <div class="barra">
                <input class="inp buscar" id="buscar" placeholder="Buscar cliente, código, teléfono o vendedor…" oninput="render()" autocomplete="off">
                <select class="inp" id="f-vendedor" onchange="render()"><option value="">Todos los vendedores</option></select>
                <select class="inp" id="f-orden" onchange="render()">
                    <option value="saldo">Mayor saldo</option>
                    <option value="cobrable">Más por cobrar ya</option>
                    <option value="nombre">Nombre</option>
                </select>
                <label class="chk"><input type="checkbox" id="f-agrupar" onchange="render()"> Agrupar por vendedor</label>
                <label class="chk"><input type="checkbox" id="f-mios" onchange="render()"> Solo mis clientes</label>
                <button class="btn" onclick="exportarExcel()" title="Descargar la lista en Excel"><span data-i="excel"></span>Excel</button>
            </div>

            <div class="card">
                <div class="tabla-wrap">
                    <table class="t">
                        <thead><tr>
                            <th>Cliente</th>
                            <th class="col-movil-no" id="th-vend">Vendedor</th>
                            <th class="num col-movil-no">Comprado</th>
                            <th class="num col-movil-no">Pagado</th>
                            <th class="num col-movil-no">En camino</th>
                            <th class="num">Saldo</th>
                            <th>Estado</th>
                            <th></th>
                        </tr></thead>
                        <tbody id="tbody"><tr><td colspan="8" class="cargando">Cargando clientes…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ═════════ ESTADO DE CUENTA ═════════ -->
        <section class="vista" id="v-estado">
            <div class="ec-buscar">
                <div class="dd">
                    <input class="inp" id="ec-buscar" style="width:100%" placeholder="Buscar cliente para ver su estado de cuenta…" autocomplete="off"
                           oninput="ddFiltrar()" onfocus="ddFiltrar()" onkeydown="ddTecla(event)">
                    <div class="dd-lista" id="dd-lista"></div>
                </div>
            </div>
            <div id="ec"><div class="card vacio">Elegí un cliente para ver su estado de cuenta.</div></div>
        </section>

        <!-- ═════════ NUEVO CLIENTE ═════════ -->
        <section class="vista" id="v-nuevo">
            <div class="card form">
                <div class="card-tit" style="margin-bottom:4px">Registrar nuevo cliente</div>
                <div class="card-sub" style="margin-bottom:16px">Los campos con * son obligatorios</div>
                <div class="form-grid">
                    <div><label>Nombre *</label><input class="inp" id="nc-nombre" placeholder="Nombre"></div>
                    <div><label>Apellido *</label><input class="inp" id="nc-apellido" placeholder="Apellido"></div>
                    <div><label>Teléfono</label><input class="inp" id="nc-telefono" placeholder="8 dígitos" maxlength="8" inputmode="numeric"></div>
                    <div><label>Correo</label><input class="inp" id="nc-correo" type="email" placeholder="correo@ejemplo.com"></div>
                    <div class="full"><label>Dirección</label><input class="inp" id="nc-direccion" placeholder="Dirección de entrega"></div>
                    <div class="full"><label>Vendedor *</label><select class="inp" id="nc-vendedor"><option value="">Elegí un vendedor…</option></select></div>
                </div>
                <div style="display:flex;gap:10px;margin-top:18px">
                    <button class="btn" onclick="limpiarForm()">Limpiar</button>
                    <button class="btn verde" style="flex:1;justify-content:center" id="nc-guardar" onclick="guardarCliente()"><span data-i="check"></span>Registrar cliente</button>
                </div>
                <div class="msg" id="nc-msg"></div>
            </div>
        </section>
    </div>
</main>

<div class="toast" id="toast"></div>

<script src="/assets/ver-articulo.js"></script>
<script>
    const usuario = JSON.parse(localStorage.getItem('ms_usuario') || 'null');
    if (!usuario) window.location.href = '/login.html';

    // ── Íconos de trazo ──
    const I = {
        lista:'<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',

    const ico = (n, st = '') => `<svg class="ico" style="${st}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
    const WA = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.88 1.21 3.08.15.2 2.1 3.2 5.08 4.48.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.75-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.05 21.8h-.01a9.85 9.85 0 0 1-5.02-1.38l-.36-.21-3.73.98 1-3.64-.24-.37a9.83 9.83 0 0 1-1.51-5.26c0-5.44 4.43-9.87 9.88-9.87 2.64 0 5.12 1.03 6.98 2.9a9.8 9.8 0 0 1 2.89 6.98c0 5.45-4.43 9.87-9.88 9.87zm8.41-18.28A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.14 1.59 5.94L.06 24l6.3-1.65a11.87 11.87 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.18-1.24-6.17-3.48-8.42z"/></svg>';
    document.querySelectorAll('[data-i]').forEach(e => e.outerHTML = ico(e.dataset.i));
    const seg = { saldos:['lista', 'Saldos'], estado:['doc', 'Estado de cuenta'], nuevo:['mas', 'Nuevo cliente'] };
    document.querySelectorAll('#seg button').forEach(b => b.innerHTML = ico(seg[b.dataset.v][0], 'width:14px;height:14px') + seg[b.dataset.v][1]);

    // ── Utilidades ──
    const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(/[^0-9.-]/g, '')); return isFinite(n) ? n : 0; };
    const L = (n, dec = 2) => 'L ' + Number(n || 0).toLocaleString('es-HN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const Lk = n => `<span class="mon">L</span>${Math.round(n || 0).toLocaleString('es-HN')}`;
    const fecha = f => { if (!f) return ''; const d = new Date(f); return isNaN(d) ? '' : d.toLocaleDateString('es-HN', { timeZone:'UTC', day:'2-digit', month:'2-digit', year:'numeric' }); };
    const iniciales = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const COLORES = ['#7c3aed', '#E8327A', '#0891b2', '#EF7A30', '#16a34a', '#2563eb', '#db2777', '#9333ea'];
    const colorDe = id => COLORES[(id || 0) % COLORES.length];
    const telWa = t => { const d = String(t || '').replace(/\D/g, ''); return d.length === 8 ? '504' + d : (d.length >= 10 ? d : ''); };
    function toast(tipo, txt) { const t = document.getElementById('toast'); t.className = 'toast ' + tipo; t.textContent = txt; clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }

    // Estado de cobro de un cliente
    function estadoDe(c) {
        const s = num(c.SaldoCalculado), p = num(c.MontoPendienteEntrega);
        if (s < -0.5) return { k:'favor', t:'A favor', cls:'e-favor', cobrable:0 };
        if (s <= 0.5) return { k:'dia', t:'Al día', cls:'e-dia', cobrable:0 };
        const cobrable = Math.max(0, s - p);
        if (p <= 0.5) return { k:'cobrar', t:'Cobrar ya', cls:'e-cobrar', cobrable };
        if (cobrable > 0.5) return { k:'parcial', t:'Cobrar ' + L(cobrable, 0), cls:'e-parcial', cobrable };
        return { k:'camino', t:'Paga al entregar', cls:'e-camino', cobrable:0 };
    }

    // ── Vistas ──
    function verVista(v) {
        document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
        document.querySelectorAll('.vista').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
        const u = new URL(location.href); u.searchParams.set('v', v); if (v !== 'estado') u.searchParams.delete('cliente'); history.replaceState(null, '', u);
    }

    // ═════════ SALDOS ═════════
    let clientes = [], filtroEstado = 'saldo', cuentas = [];
    async function cargar() {
        try {
            const d = await fetch('/api/clientes/todos').then(r => r.json());
            clientes = d.ok ? d.data : [];
        } catch (e) { clientes = []; toast('err', 'No se pudieron cargar los clientes'); }
        const vends = [...new Map(clientes.filter(c => c.IdVendedor).map(c => [c.IdVendedor, c.NombreVendedor])).entries()];
        document.getElementById('f-vendedor').innerHTML = '<option value="">Todos los vendedores</option>' + vends.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
        render();
        const q = new URLSearchParams(location.search);
        if (q.get('cliente')) abrirEstado(parseInt(q.get('cliente')));
        else if (q.get('v')) verVista(q.get('v'));
        if (q.get('f')) { filtroEstado = q.get('f'); render(); }
    }

    function base() {
        const mios = document.getElementById('f-mios').checked;
        const ven = document.getElementById('f-vendedor').value;
        return clientes.filter(c => (!mios || c.IdVendedor === usuario.id) && (!ven || String(c.IdVendedor) === ven));
    }

    function pintarKpis(lista) {
        const deben = lista.filter(c => num(c.SaldoCalculado) > 0.5);
        const tot = deben.reduce((a, c) => a + num(c.SaldoCalculado), 0);
        const cob = lista.map(c => ({ c, e: estadoDe(c) })).filter(x => x.e.cobrable > 0.5);
        const cobTot = cob.reduce((a, x) => a + x.e.cobrable, 0);
        const camino = deben.reduce((a, c) => a + Math.min(num(c.SaldoCalculado), num(c.MontoPendienteEntrega)), 0);
        const favor = lista.filter(c => num(c.SaldoCalculado) < -0.5);
        const alDia = lista.filter(c => Math.abs(num(c.SaldoCalculado)) <= 0.5).length;
        const mio = deben.filter(c => c.IdVendedor === usuario.id).reduce((a, c) => a + num(c.SaldoCalculado), 0);
        const k = (f, acento, tit, val, pie) => `<button class="kpi ${filtroEstado === f ? 'on' : ''}" style="--acento:${acento}" onclick="filtroEstado='${f}';render()">
            <div class="kpi-tit">${tit}</div><div class="kpi-val">${val}</div><div class="kpi-pie">${pie}</div></button>`;
        document.getElementById('kpis').innerHTML =
            k('deben', 'var(--rosa)', 'Por cobrar', Lk(tot), `<span>${deben.length} clientes deben</span>${mio ? `<span class="mio" title="De tus clientes">${L(mio, 0)}</span>` : ''}`) +
            k('cobrable', 'var(--rojo)', 'Cobrable ya', Lk(cobTot), `<span>${cob.length} clientes · ya entregado</span>`) +
            k('camino', 'var(--azul)', 'Se cobra al entregar', Lk(camino), `<span>artículos en camino</span>`) +
            k('favor', 'var(--morado)', 'Saldo a favor', Lk(Math.abs(favor.reduce((a, c) => a + num(c.SaldoCalculado), 0))), `<span>${favor.length} clientes</span>`) +
            k('todos', 'var(--verde)', 'Clientes', String(lista.length), `<span>${alDia} al día</span>`);
    }

    function filtrados() {
        const q = norm(document.getElementById('buscar').value);
        let l = base();
        pintarKpis(l);
        l = l.filter(c => {
            const e = estadoDe(c), s = num(c.SaldoCalculado);
            if (filtroEstado === 'saldo' && !(Math.abs(s) > 0.5)) return false;   // por defecto: los que deben y los que tienen a favor
            if (filtroEstado === 'deben' && !(s > 0.5)) return false;
            if (filtroEstado === 'cobrable' && !(e.cobrable > 0.5)) return false;
            if (filtroEstado === 'camino' && !(s > 0.5 && num(c.MontoPendienteEntrega) > 0.5)) return false;
            if (filtroEstado === 'favor' && !(s < -0.5)) return false;
            if (q && ![c.NombreCompleto, c.CodigoCliente, c.Telefeno, c.NombreVendedor, c.CodigoVendedor].some(x => norm(x).includes(q))) return false;
            return true;
        });
        const orden = document.getElementById('f-orden').value;
        l.sort(orden === 'nombre' ? (a, b) => norm(a.NombreCompleto).localeCompare(norm(b.NombreCompleto))
             : orden === 'cobrable' ? (a, b) => estadoDe(b).cobrable - estadoDe(a).cobrable || num(b.SaldoCalculado) - num(a.SaldoCalculado)
             : (a, b) => num(b.SaldoCalculado) - num(a.SaldoCalculado));
        return l;
    }

    const cerrados = new Set();
    function fila(c) {
        const e = estadoDe(c), s = num(c.SaldoCalculado), comp = num(c.TotalCompras), pag = num(c.TotalPagado);
        const pct = comp > 0 ? Math.min(100, pag * 100 / comp) : 0;
        const pend = num(c.MontoPendienteEntrega), nPend = parseInt(c.ArticulosPendienteEntrega) || 0;
        const wa = telWa(c.Telefeno);
        return `<tr class="cli ${c.IdVendedor === usuario.id ? 'mia' : ''}" onclick="abrirEstado(${c.IdCliente})">
            <td><div class="c-nom"><div class="c-av" style="background:${colorDe(c.IdCliente)}">${esc(iniciales(c.NombreCompleto))}</div>
                <div class="c-txt"><b title="${esc(c.NombreCompleto)}">${esc(c.NombreCompleto || '—')}</b><small>${esc(c.CodigoCliente || '')}${c.Telefeno ? ' · ' + esc(c.Telefeno) : ''}</small></div></div></td>
            <td class="col-movil-no col-vend" style="color:var(--suave);font-size:12px;white-space:nowrap">${esc(c.NombreVendedor || '—')}</td>
            <td class="num col-movil-no">${L(comp, 0)}<div style="font-size:11px;color:var(--mudo)">${parseInt(c.CantidadArticulos) || 0} artículos</div></td>
            <td class="num col-movil-no">${L(pag, 0)}<div class="barrita" title="${pct.toFixed(0)}% pagado"><div style="width:${pct}%;background:${pct >= 100 ? 'var(--verde)' : pct >= 70 ? 'var(--azul)' : 'var(--ambar)'}"></div></div></td>
            <td class="num col-movil-no">${pend > 0.5 ? L(pend, 0) + `<div style="font-size:11px;color:var(--mudo)">${nPend} artículo${nPend === 1 ? '' : 's'}</div>` : '<span style="color:var(--mudo)">—</span>'}</td>
            <td class="num saldo" style="color:${s > 0.5 ? '#fff' : s < -0.5 ? 'var(--morado)' : 'var(--verde)'}">${L(s)}</td>
            <td><span class="estado ${e.cls}">${esc(e.t)}</span></td>
            <td><div class="acc" onclick="event.stopPropagation()">
                ${wa ? `<a class="btn-ico wa" href="https://wa.me/${wa}" target="_blank" rel="noopener" title="Abrir chat de WhatsApp">${WA}</a>` : ''}
                <button class="btn btn-sm" onclick="abrirEstado(${c.IdCliente})">${ico('doc', 'width:14px;height:14px')}Estado de cuenta</button>
            </div></td>
        </tr>`;
    }

    function render() {
        const l = filtrados();
        const tb = document.getElementById('tbody');
        const agrupar = document.getElementById('f-agrupar').checked;
        document.querySelectorAll('#th-vend, .col-vend').forEach(x => x.style.display = agrupar ? 'none' : '');
        if (!l.length) { tb.innerHTML = `<tr><td colspan="8" class="vacio">${clientes.length ? 'No hay clientes con este filtro.' : 'No hay clientes registrados.'}</td></tr>`; return; }
        const tot = l.reduce((a, c) => a + num(c.SaldoCalculado), 0);
        let html = '';
        if (agrupar) {
            const g = new Map();
            l.forEach(c => { const k = c.IdVendedor || 0; if (!g.has(k)) g.set(k, []); g.get(k).push(c); });
            [...g.entries()].sort((a, b) => b[1].reduce((s, c) => s + num(c.SaldoCalculado), 0) - a[1].reduce((s, c) => s + num(c.SaldoCalculado), 0)).forEach(([k, cs]) => {
                const st = cs.reduce((s, c) => s + num(c.SaldoCalculado), 0);
                const cerrado = cerrados.has(k);
                html += `<tr class="grupo ${cerrado ? 'cerrado' : ''}" onclick="cerrados.has(${k}) ? cerrados.delete(${k}) : cerrados.add(${k}); render()">
                    <td colspan="5"><div class="gnom"><span class="flecha">${ico('flecha', 'width:14px;height:14px')}</span>${esc(cs[0].NombreVendedor || 'Sin vendedor')} <small>${esc(cs[0].CodigoVendedor || '')} · ${cs.length} cliente${cs.length === 1 ? '' : 's'}</small>${k === usuario.id ? '<span class="mio" style="margin-left:4px">tuyos</span>' : ''}</div></td>
                    <td class="num saldo" style="color:#fff">${L(st)}</td><td colspan="2"></td></tr>`;
                if (!cerrado) html += cs.map(fila).join('');
            });
        } else html = l.map(fila).join('');
        html += `<tr class="total-fila"><td colspan="${agrupar ? 4 : 5}" class="num" style="color:var(--suave);font-weight:600">Total de ${l.length} cliente${l.length === 1 ? '' : 's'}</td><td class="num">${L(tot)}</td><td colspan="2"></td></tr>`;
        tb.innerHTML = html;
    }

    function exportarExcel() {
        const l = filtrados();
        if (!l.length) { toast('err', 'No hay datos para exportar'); return; }
        const filas = [['Cliente', 'Código', 'Teléfono', 'Vendedor', 'Artículos', 'Comprado (L)', 'Pagado (L)', 'En camino (L)', 'Saldo (L)', 'Estado']]
            .concat(l.map(c => [c.NombreCompleto, c.CodigoCliente, c.Telefeno, c.NombreVendedor, c.CantidadArticulos, num(c.TotalCompras).toFixed(2), num(c.TotalPagado).toFixed(2), num(c.MontoPendienteEntrega).toFixed(2), num(c.SaldoCalculado).toFixed(2), estadoDe(c).t]));
        descargarXls(filas, `saldos_clientes_${new Date().toISOString().slice(0, 10)}.xls`);
    }
    function descargarXls(rows, nombre) {
        let x = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table>';
        rows.forEach((r, i) => { x += '<tr>' + r.map(v => `<${i ? 'td' : 'th'}>${esc(v ?? '')}</${i ? 'td' : 'th'}>`).join('') + '</tr>'; });
        x += '</table></body></html>';
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([x], { type:'application/vnd.ms-excel;charset=utf-8' })); a.download = nombre; a.click();
    }

    // ═════════ ESTADO DE CUENTA ═════════
    let EC = null, ecMovTodos = false, ddSel = 0;
    const opc = { movs:true, camino:true, cuentas:true };

    function ddFiltrar() {
        const q = norm(document.getElementById('ec-buscar').value);
        const l = clientes.filter(c => !q || [c.NombreCompleto, c.CodigoCliente, c.Telefeno].some(x => norm(x).includes(q)))
            .sort((a, b) => num(b.SaldoCalculado) - num(a.SaldoCalculado)).slice(0, 30);
        ddSel = 0;
        const el = document.getElementById('dd-lista');
        el.innerHTML = l.length ? l.map((c, i) => `<div class="dd-item ${i === 0 ? 'sel' : ''}" data-id="${c.IdCliente}" onmousedown="abrirEstado(${c.IdCliente})">
            <div class="c-av" style="background:${colorDe(c.IdCliente)};width:28px;height:28px;font-size:10.5px">${esc(iniciales(c.NombreCompleto))}</div>
            <div class="c-txt"><b>${esc(c.NombreCompleto)}</b><small>${esc(c.CodigoCliente || '')} · ${esc(c.NombreVendedor || '')}</small></div>
            <span class="s" style="color:${num(c.SaldoCalculado) > 0.5 ? '#fff' : 'var(--verde)'}">${L(num(c.SaldoCalculado), 0)}</span></div>`).join('')
            : '<div class="dd-item" style="color:var(--tenue)">Sin resultados</div>';
        el.classList.add('on');
    }
    function ddTecla(e) {
        const it = [...document.querySelectorAll('#dd-lista .dd-item[data-id]')];
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); ddSel = Math.max(0, Math.min(it.length - 1, ddSel + (e.key === 'ArrowDown' ? 1 : -1))); it.forEach((x, i) => x.classList.toggle('sel', i === ddSel)); it[ddSel]?.scrollIntoView({ block:'nearest' }); }
        else if (e.key === 'Enter' && it[ddSel]) { e.preventDefault(); abrirEstado(parseInt(it[ddSel].dataset.id)); }
        else if (e.key === 'Escape') document.getElementById('dd-lista').classList.remove('on');
    }
    document.addEventListener('click', e => { if (!e.target.closest('.dd')) document.getElementById('dd-lista').classList.remove('on'); });

    async function abrirEstado(id) {
        verVista('estado');
        const u = new URL(location.href); u.searchParams.set('cliente', id); history.replaceState(null, '', u);
        document.getElementById('dd-lista').classList.remove('on');
        const c0 = clientes.find(c => c.IdCliente === id);
        document.getElementById('ec-buscar').value = c0 ? c0.NombreCompleto : '';
        document.getElementById('ec').innerHTML = '<div class="card cargando">Cargando estado de cuenta…</div>';
        ecMovTodos = false;
        try {
            const [d, cu] = await Promise.all([
                fetch('/api/clientes/estado-cuenta?idCliente=' + id).then(r => r.json()),
                cuentas.length ? Promise.resolve({ ok:true, data:cuentas }) : fetch('/api/pagos/cuentas').then(r => r.json()).catch(() => ({ ok:false }))
            ]);
            if (!d.ok) throw new Error(d.error || 'Error');
            if (cu.ok) cuentas = cu.data || [];
            EC = { cliente: d.cliente || c0 || {}, movimientos: d.movimientos || [], articulos: d.articulos || [] };
            if (c0) EC.cliente = { ...c0, ...EC.cliente };
            pintarEstado();
        } catch (e) {
            document.getElementById('ec').innerHTML = `<div class="card vacio">No se pudo cargar el estado de cuenta: ${esc(e.message)}${/404|Cannot GET/i.test(e.message) ? '. Reiniciá el backend.' : ''}</div>`;
        }
    }

    function cuentasDe(c) {
        const propias = cuentas.filter(x => x.IdVendedor === c.IdVendedor);
        return (propias.length ? propias : cuentas).map(x => ({ Banco:x.Banco, NombreCuenta:x.NombreCuenta, NumeroCuenta:x.NumeroCuenta }));   // nunca el Capital
    }

    function pintarEstado() {
        const c = EC.cliente, s = num(c.SaldoCalculado), e = estadoDe(c);
        const mov = [...EC.movimientos].sort((a, b) => num(b.NumeroFila) - num(a.NumeroFila));
        const camino = EC.articulos.filter(a => !a.Entregado);
        const wa = telWa(c.Telefeno);
        const movs = ecMovTodos ? mov : mov.slice(0, 12);
        const artPorPedido = new Map(); EC.articulos.forEach(a => { const k = String(a.NumeroPedido || '').trim(); if (!artPorPedido.has(k)) artPorPedido.set(k, []); artPorPedido.get(k).push(a); });

        document.getElementById('ec').innerHTML = `
        <div class="card">
            <div class="ec-cab">
                <div class="ec-av" style="background:${colorDe(c.IdCliente)}">${esc(iniciales(c.NombreCompleto))}</div>
                <div>
                    <div class="ec-nom">${esc(c.NombreCompleto || 'Cliente')}</div>
                    <div class="ec-meta">
                        <span>${esc(c.CodigoCliente || '')}</span>
                        ${c.Telefeno ? `<span>${ico('tel', 'width:13px;height:13px')}${esc(c.Telefeno)}</span>` : ''}
                        <span>${ico('usuario', 'width:13px;height:13px')}${esc(c.NombreVendedor || 'Sin vendedor')}</span>
                        <span class="estado ${e.cls}">${esc(e.t)}</span>
                    </div>
                </div>
                <div class="ec-acc">
                    <button class="btn rosa" id="btn-copiar" onclick="copiarEstado(this)" title="Copia la imagen del estado de cuenta para pegarla en WhatsApp">${ico('copiar')}Copiar imagen</button>
                    <button class="btn" onclick="descargarEstado(this)">${ico('bajar')}Descargar</button>
                    <button class="btn" onclick="copiarMensaje()" title="Copia un mensaje de texto con el saldo">${ico('msg')}Copiar mensaje</button>
                    ${wa ? `<a class="btn" href="https://wa.me/${wa}?text=${encodeURIComponent(mensaje())}" target="_blank" rel="noopener" style="color:#25d366">${WA}WhatsApp</a>` : ''}
                    <a class="btn" href="/pagos.html?cliente=${c.IdCliente}" title="Registrar un pago de este cliente">${ico('cobro')}Registrar pago</a>
                </div>
            </div>
            <div class="opc"><b>La imagen incluye:</b>
                <label class="chk"><input type="checkbox" ${opc.movs ? 'checked' : ''} onchange="opc.movs=this.checked"> Últimos movimientos</label>
                <label class="chk"><input type="checkbox" ${opc.camino ? 'checked' : ''} onchange="opc.camino=this.checked"> Artículos en camino</label>
                <label class="chk"><input type="checkbox" ${opc.cuentas ? 'checked' : ''} onchange="opc.cuentas=this.checked"> Cuentas para depositar</label>
            </div>
        </div>

        <div class="ec-kpis">
            <div class="kpi" style="--acento:var(--borde2)"><div class="kpi-tit">Total comprado</div><div class="kpi-val">${Lk(num(c.TotalCompras))}</div><div class="kpi-pie"><span>${parseInt(c.CantidadArticulos) || EC.articulos.length} artículos</span></div></div>
            <div class="kpi" style="--acento:var(--verde)"><div class="kpi-tit">Total pagado</div><div class="kpi-val">${Lk(num(c.TotalPagado))}</div><div class="kpi-pie"><span>${parseInt(c.CantidadPagos) || mov.filter(m => m.TipoMovimiento === 'Pago').length} pagos · ${esc(c.PorcentajePagado || '')}</span></div></div>
            <div class="kpi" style="--acento:var(--rosa)"><div class="kpi-tit">${s < -0.5 ? 'Saldo a favor' : 'Saldo pendiente'}</div><div class="kpi-val" style="color:${s > 0.5 ? '#fff' : s < -0.5 ? 'var(--morado)' : 'var(--verde)'}">${Lk(Math.abs(s))}</div><div class="kpi-pie"><span>${e.cobrable > 0.5 ? L(e.cobrable, 0) + ' cobrable ya' : s > 0.5 ? 'se cobra al entregar' : 'al día'}</span></div></div>
            <div class="kpi" style="--acento:var(--azul)"><div class="kpi-tit">En camino</div><div class="kpi-val">${Lk(num(c.MontoPendienteEntrega) || camino.reduce((a, x) => a + num(x.Venta), 0))}</div><div class="kpi-pie"><span>${camino.length} artículo${camino.length === 1 ? '' : 's'} sin entregar</span></div></div>
        </div>

        <div class="ec-grid">
            <div class="card">
                <div class="card-cab"><div><div class="card-tit">Movimientos</div><div class="card-sub">Del más reciente al más antiguo · tocá una compra para ver sus artículos</div></div>
                    <button class="btn btn-sm" onclick="exportarMovs()">${ico('excel', 'width:14px;height:14px')}Excel</button></div>
                <div class="tabla-wrap" style="margin-top:8px">
                    <table class="t">
                        <thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Cargo</th><th class="num">Abono</th><th class="num">Saldo</th></tr></thead>
                        <tbody>${movs.length ? movs.map((m, i) => {
                            const comp = m.TipoMovimiento === 'Compra', pago = m.TipoMovimiento === 'Pago';
                            const ref = String(m.NumeroReferencia || '').trim();
                            const arts = comp ? (artPorPedido.get(ref) || []) : [];
                            return `<tr class="mov ${comp && arts.length ? 'compra' : ''}" ${comp && arts.length ? `onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? '' : 'none'"` : ''}>
                                <td style="white-space:nowrap;color:var(--suave);font-size:12px">${fecha(m.FechaMovimiento)}</td>
                                <td><span class="mov-tipo ${comp ? 'mt-compra' : pago ? 'mt-pago' : 'mt-otro'}">${esc(m.TipoMovimiento)}</span> <span class="ref">${esc(ref)}</span>${arts.length ? ` <small style="color:var(--mudo)">· ${arts.length} art.</small>` : ''}</td>
                                <td class="num">${comp ? L(num(m.Monto)) : ''}</td>
                                <td class="num" style="color:var(--verde)">${!comp ? L(num(m.Monto)) : ''}</td>
                                <td class="num" style="font-weight:700;color:${num(m.SaldoFecha) > 0.5 ? '#fff' : 'var(--verde)'}">${L(num(m.SaldoFecha))}</td></tr>
                                ${arts.length ? `<tr class="detalle" style="display:none"><td colspan="5">${arts.map(miniArt).join('')}</td></tr>` : ''}`;
                        }).join('') : '<tr><td colspan="5" class="vacio">Sin movimientos</td></tr>'}</tbody>
                    </table>
                </div>
                ${mov.length > 12 ? `<button class="ver-mas" onclick="ecMovTodos=!ecMovTodos;pintarEstado()">${ecMovTodos ? 'Ver solo los recientes' : `Ver los ${mov.length} movimientos`}</button>` : '<div style="height:10px"></div>'}
            </div>
            <div class="card" style="align-self:start">
                <div class="card-cab"><div><div class="card-tit">Artículos en camino</div><div class="card-sub">Comprados y aún sin entregar</div></div></div>
                <div class="lista-art">${camino.length ? camino.map(miniArt).join('') : '<div class="vacio" style="padding:20px">No tiene artículos en camino.</div>'}</div>
            </div>
        </div>`;
    }

    function miniArt(a) {
        return `<div class="mini-art">
            ${a.Fotografia ? `<img src="${esc(a.Fotografia)}" loading="lazy" alt="" onclick="verArt(${a.IdDetallePedido})" onerror="this.outerHTML='<div class=\\'ph\\'></div>'">` : `<div class="ph" onclick="verArt(${a.IdDetallePedido})"></div>`}
            <div class="n"><b title="${esc(a.NombreArticulo || a.DescripcionArticulo)}">${esc(a.NombreArticulo || a.DescripcionArticulo || 'Artículo')}</b>
                <small>${a.TallaColor ? esc(a.TallaColor) + ' · ' : ''}${fecha(a.FechaPedido)} · ${a.Entregado ? 'Entregado' : 'En camino'}</small></div>
            <div class="num" style="font-weight:700">${num(a.Venta) ? L(num(a.Venta), 0) : '<span style="color:var(--mudo);font-weight:400">sin precio</span>'}</div></div>`;
    }
    function verArt(id) {
        const a = EC.articulos.find(x => x.IdDetallePedido === id); if (!a) return;
        verArticuloModal({ ...a, ValorCobroCliente:a.Venta, CantidadArticulos:a.Cantidad, NombreCliente:EC.cliente.NombreCompleto, NombreVendedor:EC.cliente.NombreVendedor });
    }

    function exportarMovs() {
        const mov = [...EC.movimientos].sort((a, b) => num(a.NumeroFila) - num(b.NumeroFila));
        descargarXls([['Fecha', 'Tipo', 'Referencia', 'Cargo (L)', 'Abono (L)', 'Saldo (L)']].concat(mov.map(m => [fecha(m.FechaMovimiento), m.TipoMovimiento, String(m.NumeroReferencia || '').trim(),
            m.TipoMovimiento === 'Compra' ? num(m.Monto).toFixed(2) : '', m.TipoMovimiento !== 'Compra' ? num(m.Monto).toFixed(2) : '', num(m.SaldoFecha).toFixed(2)])),
            `estado_cuenta_${(EC.cliente.CodigoCliente || EC.cliente.IdCliente)}_${new Date().toISOString().slice(0, 10)}.xls`);
    }

    function mensaje() {
        const c = EC.cliente, s = num(c.SaldoCalculado), camino = EC.articulos.filter(a => !a.Entregado);
        const nombre = String(c.NombreCompleto || '').split(/\s+/)[0];
        const hoy = new Date().toLocaleDateString('es-HN', { day:'2-digit', month:'2-digit', year:'numeric' });
        let t = `Hola ${nombre}, te saluda ShopAholic.\n\n`;
        if (s > 0.5) {
            t += `Tu saldo pendiente al ${hoy} es de *${L(s)}*.\n`;
            const cob = estadoDe(c).cobrable;
            if (camino.length) t += `Tenés ${camino.length} artículo${camino.length === 1 ? '' : 's'} en camino.\n`;
            if (cob > 0.5 && camino.length) t += `De ese saldo, ${L(cob)} corresponde a artículos ya entregados.\n`;
        } else if (s < -0.5) t += `Tenés un saldo a favor de *${L(Math.abs(s))}* al ${hoy}.\n`;
        else t += `Tu cuenta está al día al ${hoy}. ¡Gracias!\n`;
        t += `\nTotal comprado: ${L(num(c.TotalCompras))}\nTotal pagado: ${L(num(c.TotalPagado))}\n`;
        const cu = cuentasDe(c);
        if (s > 0.5 && cu.length) t += `\nPodés depositar en:\n` + cu.map(x => `• ${x.Banco || ''} · ${x.NombreCuenta || ''} · ${x.NumeroCuenta || ''}`).join('\n') + '\n';
        return t + `\n¡Gracias por comprar con nosotros!`;
    }
    async function copiarMensaje() {
        try { await navigator.clipboard.writeText(mensaje()); toast('ok', 'Mensaje copiado'); }
        catch (e) { toast('err', 'No se pudo copiar el mensaje'); }
    }

    // ── Imagen del estado de cuenta (canvas) ──
    function cargarImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
    function rr(x, X, Y, W, H, R) { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
    function recortar(x, t, w) { t = String(t || ''); if (x.measureText(t).width <= w) return t; while (t && x.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }

    async function lienzo() {
        const c = EC.cliente, s = num(c.SaldoCalculado), e = estadoDe(c);
        const mov = [...EC.movimientos].sort((a, b) => num(b.NumeroFila) - num(a.NumeroFila)).slice(0, 10);
        const camino = EC.articulos.filter(a => !a.Entregado).slice(0, 8);
        const cu = cuentasDe(c).slice(0, 4);
        const W = 1080, M = 64, F = "'Segoe UI', Arial, sans-serif";
        let H = 640;
        if (opc.movs && mov.length) H += 120 + mov.length * 58;
        if (opc.camino && camino.length) H += 110 + camino.length * 50;
        if (opc.cuentas && cu.length && s > 0.5) H += 110 + cu.length * 54;
        H += 130;
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const x = cv.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
        const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#E8327A'); g.addColorStop(1, '#EF7A30');
        x.fillStyle = g; x.fillRect(0, 0, W, 12);
        const logo = await cargarImg('/assets/shopaholic-logo.png');
        let y = 52;
        if (logo) { const lh = 84; x.drawImage(logo, M, y, logo.width * lh / logo.height, lh); }
        x.textAlign = 'right'; x.textBaseline = 'top';
        x.fillStyle = '#111827'; x.font = `800 40px ${F}`; x.fillText('ESTADO DE CUENTA', W - M, y + 6);
        x.fillStyle = '#6b7280'; x.font = `500 24px ${F}`; x.fillText('Al ' + new Date().toLocaleDateString('es-HN', { day:'2-digit', month:'long', year:'numeric' }), W - M, y + 56);
        x.textAlign = 'left';
        y = 178;
        // cliente
        rr(x, M, y, W - 2 * M, 112, 18); x.fillStyle = '#f8fafc'; x.fill(); x.strokeStyle = '#eef0f3'; x.lineWidth = 2; x.stroke();
        x.fillStyle = '#9ca3af'; x.font = `700 20px ${F}`; x.fillText('CLIENTE', M + 28, y + 20);
        x.fillStyle = '#111827'; x.font = `800 36px ${F}`; x.fillText(recortar(x, c.NombreCompleto, 620), M + 28, y + 48);
        x.textAlign = 'right'; x.fillStyle = '#6b7280'; x.font = `500 24px ${F}`;
        x.fillText([c.CodigoCliente, c.Telefeno].filter(Boolean).join(' · '), W - M - 28, y + 56); x.textAlign = 'left';
        y += 140;
        // totales
        const bw = (W - 2 * M - 32) / 3;
        const caja = (i, tit, val, color, fondo) => {
            const bx = M + i * (bw + 16);
            rr(x, bx, y, bw, 150, 18); x.fillStyle = fondo; x.fill();
            x.fillStyle = '#6b7280'; x.font = `700 20px ${F}`; x.fillText(tit, bx + 24, y + 26);
            x.fillStyle = color; x.font = `800 ${val.length > 11 ? 34 : 40}px ${F}`; x.fillText(val, bx + 24, y + 70);
        };
        caja(0, 'TOTAL COMPRADO', L(num(c.TotalCompras)), '#111827', '#f8fafc');
        caja(1, 'TOTAL PAGADO', L(num(c.TotalPagado)), '#15803d', '#f0fdf4');
        caja(2, s < -0.5 ? 'SALDO A FAVOR' : 'SALDO PENDIENTE', L(Math.abs(s)), s > 0.5 ? '#E8327A' : '#15803d', s > 0.5 ? '#fdf2f8' : '#f0fdf4');
        y += 186;
        const titulo = t => { x.fillStyle = '#111827'; x.font = `800 28px ${F}`; x.fillText(t, M, y); y += 50; x.strokeStyle = '#eef0f3'; x.lineWidth = 2; x.beginPath(); x.moveTo(M, y - 8); x.lineTo(W - M, y - 8); x.stroke(); };
        if (opc.movs && mov.length) {
            titulo('Últimos movimientos');
            x.fillStyle = '#9ca3af'; x.font = `700 19px ${F}`;
            x.fillText('FECHA', M, y + 4); x.fillText('CONCEPTO', M + 190, y + 4);
            x.textAlign = 'right'; x.fillText('MONTO', W - M - 230, y + 4); x.fillText('SALDO', W - M, y + 4); x.textAlign = 'left';
            y += 42;
            mov.forEach((m, i) => {
                const comp = m.TipoMovimiento === 'Compra';
                if (i % 2 === 0) { x.fillStyle = '#fafafa'; x.fillRect(M - 12, y - 10, W - 2 * M + 24, 54); }
                x.fillStyle = '#4b5563'; x.font = `500 23px ${F}`; x.fillText(fecha(m.FechaMovimiento), M, y + 4);
                x.fillStyle = comp ? '#be185d' : '#15803d'; x.font = `700 23px ${F}`; x.fillText(m.TipoMovimiento, M + 190, y + 4);
                x.fillStyle = '#9ca3af'; x.font = `500 20px ${F}`; x.fillText(recortar(x, String(m.NumeroReferencia || '').trim(), 210), M + 310, y + 7);
                x.textAlign = 'right';
                x.fillStyle = comp ? '#111827' : '#15803d'; x.font = `700 23px ${F}`; x.fillText((comp ? '' : '− ') + L(num(m.Monto)), W - M - 230, y + 4);
                x.fillStyle = '#111827'; x.font = `800 23px ${F}`; x.fillText(L(num(m.SaldoFecha)), W - M, y + 4);
                x.textAlign = 'left'; y += 58;
            });
            y += 34;
        }
        if (opc.camino && camino.length) {
            titulo(`Artículos en camino (${EC.articulos.filter(a => !a.Entregado).length})`);
            camino.forEach(a => {
                x.fillStyle = '#E8327A'; x.beginPath(); x.arc(M + 8, y + 15, 6, 0, 7); x.fill();
                x.fillStyle = '#111827'; x.font = `600 24px ${F}`;
                x.fillText(recortar(x, (a.NombreArticulo || a.DescripcionArticulo || 'Artículo') + (a.TallaColor ? ' · ' + a.TallaColor : ''), 700), M + 30, y);
                x.textAlign = 'right'; x.font = `700 24px ${F}`; x.fillText(num(a.Venta) ? L(num(a.Venta), 0) : '—', W - M, y); x.textAlign = 'left';
                y += 50;
            });
            y += 34;
        }
        if (opc.cuentas && cu.length && s > 0.5) {
            titulo('Cuentas para depositar');
            cu.forEach(k => {
                x.fillStyle = '#111827'; x.font = `700 24px ${F}`; x.fillText(recortar(x, k.Banco || '', 300), M, y);
                x.fillStyle = '#4b5563'; x.font = `500 24px ${F}`; x.fillText(recortar(x, k.NombreCuenta || '', 380), M + 310, y);
                x.textAlign = 'right'; x.fillStyle = '#111827'; x.font = `700 26px ${F}`; x.fillText(k.NumeroCuenta || '', W - M, y); x.textAlign = 'left';
                y += 54;
            });
            y += 30;
        }
        // pie: recortar el lienzo a lo que realmente se dibujó
        const HF = Math.max(y + 24, 760) + 96;
        const fin = document.createElement('canvas'); fin.width = W; fin.height = HF;
        const f = fin.getContext('2d');
        f.drawImage(cv, 0, 0);
        f.fillStyle = g; f.fillRect(0, HF - 96, W, 96);
        f.fillStyle = '#fff'; f.font = `700 28px ${F}`; f.textAlign = 'center'; f.textBaseline = 'middle';
        f.fillText('¡Gracias por comprar con nosotros!', W / 2, HF - 48);
        return fin;
    }
    const aBlob = cv => new Promise(r => cv.toBlob(r, 'image/png'));
    const nombreArchivo = () => ('estado-cuenta-' + (EC.cliente.NombreCompleto || EC.cliente.IdCliente)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-') + '.png';
    async function descargarEstado(btn) {
        btn.disabled = true;
        try { const b = await aBlob(await lienzo()); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nombreArchivo(); a.click(); }
        catch (e) { toast('err', 'No se pudo generar la imagen'); }
        btn.disabled = false;
    }
    async function copiarEstado(btn) {
        const txt = btn.innerHTML; btn.disabled = true; btn.textContent = 'Generando…';
        try {
            const cv = await lienzo();
            if (!navigator.clipboard || !window.ClipboardItem) throw new Error('sin');
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': aBlob(cv) })]);
            toast('ok', 'Estado de cuenta copiado. Pegalo en WhatsApp con Ctrl+V');
        } catch (e) { await descargarEstado(btn); toast('err', 'El navegador no dejó copiar; se descargó la imagen.'); }
        btn.disabled = false; btn.innerHTML = txt;
    }

    // ═════════ NUEVO CLIENTE ═════════
    async function cargarVendedores() {
        try {
            const d = await fetch('/api/vendedores').then(r => r.json());
            const sel = document.getElementById('nc-vendedor');
            (d.ok ? d.data : []).forEach(v => { const o = document.createElement('option'); o.value = v.IdVendedor; o.textContent = `${v.Nombres} ${v.Apellidos || ''} (${v.CodigoVendedor || ''})`; sel.appendChild(o); });
            if (!usuario.esAdmin) { sel.value = usuario.id; sel.disabled = true; }
        } catch (e) {}
    }
    function limpiarForm() {
        ['nc-nombre', 'nc-apellido', 'nc-telefono', 'nc-correo', 'nc-direccion'].forEach(i => document.getElementById(i).value = '');
        if (usuario.esAdmin) document.getElementById('nc-vendedor').value = '';
        document.getElementById('nc-msg').className = 'msg';
    }
    async function guardarCliente() {
        const v = i => document.getElementById(i).value.trim();
        const msg = document.getElementById('nc-msg');
        const tel = v('nc-telefono').replace(/\D/g, '');
        if (!v('nc-nombre') || !v('nc-apellido') || !v('nc-vendedor')) { msg.className = 'msg err'; msg.textContent = 'Nombre, apellido y vendedor son obligatorios.'; return; }
        if (tel && tel.length !== 8) { msg.className = 'msg err'; msg.textContent = 'El teléfono debe tener 8 dígitos.'; return; }
        const b = document.getElementById('nc-guardar'); b.disabled = true;
        try {
            const d = await fetch('/api/clientes/nuevo', { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ nombre:v('nc-nombre'), apellido:v('nc-apellido'), telefono:tel, correo:v('nc-correo'), direccion:v('nc-direccion'), idVendedor:parseInt(v('nc-vendedor')) }) }).then(r => r.json());
            if (d.ok) { msg.className = 'msg ok'; msg.textContent = `Cliente ${v('nc-nombre')} ${v('nc-apellido')} registrado.`; limpiarForm(); msg.className = 'msg ok'; cargar(); }
            else { msg.className = 'msg err'; msg.textContent = 'Error: ' + d.error; }
        } catch (e) { msg.className = 'msg err'; msg.textContent = 'Error de conexión.'; }
        b.disabled = false;
    }

    // ── Inicio ──
    if (usuario) {
        if (!usuario.esAdmin) document.getElementById('f-mios').checked = true;
        else document.getElementById('f-agrupar').checked = false;
        cargar();
        cargarVendedores();
    }
    window.addEventListener('articulo-actualizado', e => { const a = e.detail && e.detail.articulo; if (!EC || !a) return; const x = EC.articulos.find(z => z.IdDetallePedido === a.IdDetallePedido); if (x) { x.Fotografia = a.Fotografia; pintarEstado(); } });
</script>
<script src="/assets/sidebar.js"></script>
</body>
</html>
